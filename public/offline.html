<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827">
<title>OURCOM - 오프라인</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box;background:#f5f6f8;color:#111827;font-family:Arial,"Noto Sans KR",sans-serif;text-align:center}
.box{max-width:420px;padding:32px;border-radius:22px;background:#fff;box-shadow:0 10px 35px rgba(0,0,0,.08)}
h1{margin:0 0 12px}.icon{font-size:48px}p{color:#6b7280;line-height:1.6}button{padding:12px 18px;border:0;border-radius:12px;background:#111827;color:#fff;font-weight:bold;cursor:pointer}
</style>
</head>
<body><main class="box"><div class="icon">📡</div><h1>인터넷 연결이 필요해요</h1><p>OURCOM 채팅을 사용하려면 인터넷에 연결한 뒤 다시 시도해주세요.</p><button onclick="location.reload()">다시 연결</button></main></body>
</html>
