<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/icons/ourcom-192.png"><script defer src="/pwa.js"></script><title>OURCOM 채팅</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f8;color:#111827;font-family:Arial,"Noto Sans KR",sans-serif}.header{height:62px;padding:0 18px;display:flex;align-items:center;background:#111827;color:#fff;font-size:19px;font-weight:800}.header .home{margin-left:auto;padding:9px 12px;border:0;border-radius:9px;background:#374151;color:#fff}.container{max-width:720px;margin:18px auto;padding:0 14px}.panel{padding:18px;border-radius:16px;background:#fff;box-shadow:0 4px 16px rgba(0,0,0,.05)}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:12px;padding:4px;border-radius:11px;background:#f1f5f9}.tab{padding:10px;border:0;border-radius:8px;background:transparent;color:#64748b;font-weight:800}.tab.active{background:#fff;color:#111827;box-shadow:0 2px 7px rgba(0,0,0,.08)}.search{width:100%;margin:0 0 10px;padding:11px 13px;border:1px solid #dbe1e8;border-radius:10px;background:#f8fafc;font-size:14px;outline:none}.search:focus{border-color:#64748b;background:#fff}.section-title{display:flex;align-items:center;margin:18px 4px 7px;font-size:13px;color:#64748b;font-weight:800}.section-title:first-of-type{margin-top:8px}.section-title button{margin-left:auto;padding:6px 9px;border:0;border-radius:7px;background:#111827;color:#fff;font-size:11px}.item{display:flex;align-items:center;gap:11px;min-height:67px;padding:10px 7px;border-bottom:1px solid #edf0f3;cursor:pointer}.item:last-child{border-bottom:0}.item:hover{background:#f8fafc}.avatar{width:43px;height:43px;flex:0 0 43px;display:grid;place-items:center;overflow:hidden;border-radius:50%;background:#e5e7eb;color:#64748b;font-weight:800}.avatar img{width:100%;height:100%;object-fit:cover}.identity{min-width:0;flex:1}.name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px;font-weight:800}.meta{margin-top:4px;color:#94a3b8;font-size:11px}.dot{display:inline-block;width:10px;height:10px;flex:0 0 10px;border-radius:50%;background:#ef4444}.badge{min-width:20px;padding:3px 6px;border-radius:999px;background:#ef4444;color:#fff;text-align:center;font-size:10px;font-weight:800}.rename{padding:6px 8px;border:0;border-radius:7px;background:#eef2ff;color:#3730a3;font-size:10px;font-weight:700}.empty{padding:22px;color:#94a3b8;text-align:center;font-size:13px}.hidden{display:none}@media(max-width:650px){.header{height:54px;padding:0 10px;font-size:16px}.container{margin:8px auto;padding:0 8px}.panel{padding:9px;border-radius:12px}.tabs{margin-bottom:8px}.tab{padding:8px;font-size:12px}.search{padding:9px 11px;font-size:12px}.section-title{margin-top:12px;font-size:11px}.item{min-height:56px;padding:7px 4px;gap:8px}.avatar{width:36px;height:36px;flex-basis:36px;font-size:12px}.name{font-size:12px}.meta{font-size:9px}.rename{padding:5px 6px;font-size:9px}}
</style></head><body>
<header class="header">채팅<button class="home" onclick="location.href='/main.html'">홈</button></header>
<main class="container"><div class="panel"><div class="tabs"><button id="chatTab" class="tab active" onclick="showTab('chat')">채팅</button><button id="friendTab" class="tab" onclick="showTab('friend')">친구 <span id="newFriendDot" class="dot hidden"></span></button></div>
<section id="chatView"><input id="chatSearch" class="search" type="search" placeholder="친구 또는 단체방 검색" autocomplete="off"><div class="section-title">최근 채팅</div><div id="directChats"></div><div class="section-title">단체 채팅<button onclick="event.stopPropagation();location.href='/group-create.html'">새 단체방</button></div><div id="rooms"></div></section>
<section id="friendView" class="hidden"><input id="friendSearch" class="search" type="search" placeholder="친구 이름 또는 아이디 검색" autocomplete="off"><div class="section-title">모든 친구</div><div id="friends"></div></section></div></main>
<script src="/socket.io/socket.io.js"></script><script>
let navigation=null;let socket=null;const esc=value=>{const d=document.createElement("div");d.textContent=value??"";return d.innerHTML};
function avatar(user){const image=user.profileImage&&user.profileImage.secureUrl;return image?`<div class="avatar"><img src="${esc(image)}" alt=""></div>`:`<div class="avatar">${esc((user.displayName||user.name||"?").slice(0,1))}</div>`}
function personRow(user){return `<div class="item" data-user="${esc(user.id)}">${avatar(user)}<div class="identity"><div class="name">${esc(user.displayName||user.name)}</div><div class="meta">@${esc(user.id)}${user.displayName!==user.name?` · 원래 이름 ${esc(user.name)}`:""}</div></div>${user.isNew?'<span class="dot" title="새 친구"></span>':""}${user.unreadCount?`<span class="badge">${user.unreadCount}</span>`:""}<button class="rename" data-rename="${esc(user.id)}">이름 설정</button></div>`}
function bindPeople(container){container.querySelectorAll("[data-user]").forEach(row=>row.onclick=()=>location.href=`/private.html?id=${encodeURIComponent(row.dataset.user)}`);container.querySelectorAll("[data-rename]").forEach(button=>button.onclick=event=>{event.stopPropagation();renameFriend(button.dataset.rename)})}
function matches(value,query){return String(value||"").toLocaleLowerCase("ko").includes(query)}
function renderNavigation(){if(!navigation)return;const chatQuery=document.getElementById("chatSearch").value.trim().toLocaleLowerCase("ko"),friendQuery=document.getElementById("friendSearch").value.trim().toLocaleLowerCase("ko");const filteredChats=navigation.chats.filter(user=>[user.displayName,user.name,user.id].some(value=>matches(value,chatQuery))),filteredFriends=navigation.friends.filter(user=>[user.displayName,user.name,user.id].some(value=>matches(value,friendQuery))),filteredRooms=navigation.rooms.filter(room=>matches(room.name,chatQuery));const chats=document.getElementById("directChats"),friends=document.getElementById("friends"),rooms=document.getElementById("rooms");chats.innerHTML=filteredChats.length?filteredChats.map(personRow).join(""):`<div class="empty">${chatQuery?"검색 결과가 없습니다.":"채팅한 친구가 없습니다. 친구 탭에서 대화를 시작하세요."}</div>`;friends.innerHTML=filteredFriends.length?filteredFriends.map(personRow).join(""):`<div class="empty">${friendQuery?"검색 결과가 없습니다.":"등록된 친구가 없습니다."}</div>`;rooms.innerHTML=filteredRooms.length?filteredRooms.map(room=>`<div class="item" data-room="${room.id}"><div class="avatar">단</div><div class="identity"><div class="name">${esc(room.name)}</div><div class="meta">${room.memberCount}명 참여</div></div>${room.unreadCount?`<span class="badge">${room.unreadCount}</span>`:""}</div>`).join(""):`<div class="empty">${chatQuery?"검색 결과가 없습니다.":"참여 중인 단체방이 없습니다."}</div>`;bindPeople(chats);bindPeople(friends);rooms.querySelectorAll("[data-room]").forEach(row=>row.onclick=()=>location.href=`/group-room.html?id=${row.dataset.room}`);document.getElementById("newFriendDot").classList.toggle("hidden",!navigation.newFriendCount)}
async function loadNavigation(){try{const response=await fetch("/api/navigation");if(response.status===401)return location.href="/";navigation=await response.json();if(!navigation.success)throw Error("목록을 불러오지 못했습니다.");renderNavigation()}catch(error){["directChats","friends","rooms"].forEach(id=>document.getElementById(id).textContent="목록을 불러오지 못했습니다.")}}
async function renameFriend(id){const user=[...(navigation?.chats||[]),...(navigation?.friends||[])].find(item=>item.id===id);const alias=prompt("나에게만 보일 이름을 입력하세요. 비우면 원래 이름으로 돌아갑니다.",user?.displayName||"");if(alias===null)return;const response=await fetch(`/api/users/${encodeURIComponent(id)}/alias`,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({alias:alias.trim()})});const data=await response.json();if(!data.success)return alert(data.message||"이름을 변경하지 못했습니다.");loadNavigation()}
async function showTab(tab){const friend=tab==="friend";document.getElementById("chatView").classList.toggle("hidden",friend);document.getElementById("friendView").classList.toggle("hidden",!friend);document.getElementById("chatTab").classList.toggle("active",!friend);document.getElementById("friendTab").classList.toggle("active",friend);if(friend){document.getElementById("newFriendDot").classList.add("hidden");await fetch("/api/friends/seen",{method:"POST"})}}
function connect(){socket=io();socket.on("account id changed",()=>{alert("관리자가 아이디를 변경했습니다. 새 아이디로 다시 접속합니다.");location.reload()});let timer;const refresh=()=>{clearTimeout(timer);timer=setTimeout(loadNavigation,120)};["private message","private-read-update","unread changed","friends updated","chat room invitation","profile updated"].forEach(event=>socket.on(event,refresh))}
document.getElementById("chatSearch").addEventListener("input",renderNavigation);document.getElementById("friendSearch").addEventListener("input",renderNavigation);
loadNavigation().then(()=>{connect();if(new URLSearchParams(location.search).get("tab")==="friend")showTab("friend")});
</script></body></html>
