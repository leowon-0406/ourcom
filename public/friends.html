<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">
<meta name="theme-color" content="#111827">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/ourcom-192.png">
<script defer src="/pwa.js"></script>

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>OURCOM - 친구</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;

            font-family:
                Arial,
                "Noto Sans KR",
                sans-serif;

            background: #f5f6f8;
        }

        .header {
            height: 70px;

            background: #111827;
            color: white;

            display: flex;
            align-items: center;

            padding: 0 20px;

            font-size: 20px;
            font-weight: bold;
        }

        .back {
            margin-left: auto;

            border: none;
            border-radius: 10px;

            padding: 10px 15px;

            background: #374151;
            color: white;

            cursor: pointer;
        }

        .container {
            max-width: 700px;

            margin: 30px auto;

            padding: 0 20px;
        }

        .box {
            background: white;

            border-radius: 18px;

            padding: 25px;

            box-shadow:
                0 5px 20px
                rgba(0,0,0,0.05);
        }

        h2 {
            margin-top: 0;
        }

        .friend {
            display: flex;

            align-items: center;

            padding: 16px;

            border-bottom:
                1px solid #eeeeee;

            cursor: pointer;

            border-radius: 12px;

            transition: 0.15s;
        }

        .friend:hover {
            background: #f3f4f6;
        }

        .friend:last-child {
            border-bottom: none;
        }

        .avatar {
            width: 45px;
            height: 45px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: #e5e7eb;

            font-size: 20px;

            margin-right: 15px;
        }

        .friend-name {
            font-weight: bold;
        }

        .friend-id {
            margin-top: 4px;

            font-size: 13px;

            color: #9ca3af;
        }

        .friend-info {
            min-width: 0;
        }

        .unread-dot {
            width: 11px;
            height: 11px;
            margin-left: auto;
            margin-right: 14px;
            border-radius: 50%;
            background: #ef4444;
            box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.15);
            display: none;
            flex: 0 0 auto;
        }

        .unread-dot.visible {
            display: block;
        }

        .arrow {
            color: #9ca3af;

            font-size: 20px;
        }

        .empty {
            padding: 30px;

            text-align: center;

            color: #999;
        }

        .loading {
            padding: 30px;

            text-align: center;

            color: #999;
        }

    </style>

</head>


<body>

<div class="header">

    👥 OURCOM 친구

    <button
        class="back"
        onclick="location.href='/main.html'"
    >
        ← 홈
    </button>

</div>


<div class="container">

    <div class="box">

        <h2>
            친구 목록
        </h2>

        <div
            id="friends"
            class="loading"
        >
            친구 목록을 불러오는 중...
        </div>

    </div>

</div>


<script src="/socket.io/socket.io.js"></script>

<script>

let socket;
let unreadCounts = {};

async function loadFriends() {

    try {

        const meResponse =
            await fetch("/api/me");

        const me =
            await meResponse.json();

        if (!me.loggedIn) {

            location.href = "/";

            return;

        }


        const [usersResponse, unreadResponse] =
            await Promise.all([
                fetch("/api/users?sort=recent"),
                fetch("/api/private-unread-counts")
            ]);

        const data = await usersResponse.json();
        const unreadData = await unreadResponse.json();

        unreadCounts =
            unreadData.success
                ? unreadData.counts
                : {};


        const container =
            document.getElementById(
                "friends"
            );


        if (
            !data.success ||
            data.users.length === 0
        ) {

            container.className = "empty";

            container.textContent =
                "아직 등록된 친구가 없습니다.";

            return;

        }


        container.className = "";


        container.innerHTML =
            data.users.map(user => `

                <div
                    class="friend"
                    data-friend-id="${escapeHtml(user.id)}"
                    role="button"
                    tabindex="0"
                >

                    <div class="avatar">
                        👤
                    </div>

                    <div class="friend-info">

                        <div class="friend-name">
                            ${escapeHtml(user.name)}
                        </div>

                        <div class="friend-id">
                            @${escapeHtml(user.id)}
                        </div>

                    </div>

                    <span
                        class="unread-dot ${Number(unreadCounts[user.id] || 0) > 0 ? "visible" : ""}"
                        data-unread-user="${escapeHtml(user.id)}"
                        aria-label="읽지 않은 메시지 있음"
                    ></span>

                    <div class="arrow">
                        ›
                    </div>

                </div>

            `).join("");

        container
            .querySelectorAll("[data-friend-id]")
            .forEach(friendElement => {

                const open =
                    () => openChat(
                        friendElement.dataset.friendId
                    );

                friendElement.addEventListener(
                    "click",
                    open
                );

                friendElement.addEventListener(
                    "keydown",
                    event => {
                        if (
                            event.key === "Enter" ||
                            event.key === " "
                        ) {
                            event.preventDefault();
                            open();
                        }
                    }
                );

            });

    }

    catch (error) {

        console.error(error);

        document.getElementById(
            "friends"
        ).textContent =
            "친구 목록을 불러오지 못했습니다.";

    }

}


async function updateUnreadDots() {

    try {

        const response =
            await fetch("/api/private-unread-counts");

        if (response.status === 401) {
            location.href = "/";
            return;
        }

        const data = await response.json();

        if (!data.success) {
            return;
        }

        unreadCounts = data.counts || {};

        document
            .querySelectorAll("[data-unread-user]")
            .forEach(dot => {

                const userId =
                    dot.dataset.unreadUser;

                dot.classList.toggle(
                    "visible",
                    Number(unreadCounts[userId] || 0) > 0
                );

            });

    }
    catch (error) {
        console.error(
            "안 읽은 메시지 확인 오류:",
            error
        );
    }

}


function connectNotifications() {

    socket = io();

    socket.on(
        "private message",
        () => loadFriends()
    );

    socket.on(
        "private-read-update",
        updateUnreadDots
    );

    socket.on(
        "connect",
        updateUnreadDots
    );

}


function openChat(id) {

    location.href =
        `/private.html?id=${encodeURIComponent(id)}`;

}


function escapeHtml(text) {

    const div =
        document.createElement("div");

    div.textContent = text;

    return div.innerHTML;

}


loadFriends().then(connectNotifications);

</script>

</body>

</html>
