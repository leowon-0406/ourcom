<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/icons/ourcom-192.png"><script defer src="/pwa.js"></script><title>OURCOM 미니게임</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f8;color:#111827;font-family:Arial,"Noto Sans KR",sans-serif}.header{height:60px;padding:0 16px;display:flex;align-items:center;gap:10px;background:#111827;color:#fff}.header h1{margin:0;font-size:18px}.header button{margin-left:auto;padding:8px 12px;border:0;border-radius:9px;background:#374151;color:#fff;font-weight:700}.container{max-width:900px;margin:20px auto;padding:0 14px}.intro{margin-bottom:15px}.intro h2{margin:0;font-size:24px}.intro p{margin:6px 0 0;color:#64748b;font-size:13px}.games{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.game-card{padding:18px;border:0;border-radius:16px;background:#fff;color:#111827;text-align:left;box-shadow:0 4px 14px rgba(0,0,0,.05);cursor:pointer}.game-card:hover{transform:translateY(-2px)}.game-name{font-size:17px;font-weight:900}.game-desc{margin-top:7px;color:#64748b;font-size:12px;line-height:1.45}.best{margin-top:13px;color:#4f46e5;font-size:12px;font-weight:800}.ranking{margin-top:16px;padding:18px;border-radius:16px;background:#fff;box-shadow:0 4px 14px rgba(0,0,0,.05)}.ranking-head{display:flex;align-items:center;gap:10px}.ranking h2{margin:0;font-size:18px}.ranking select{margin-left:auto;padding:8px;border:1px solid #d1d5db;border-radius:9px;background:#fff}.rank-row{display:grid;grid-template-columns:34px 1fr auto;gap:8px;padding:10px 4px;border-bottom:1px solid #edf0f3;align-items:center}.rank-row:last-child{border:0}.rank-number{font-weight:900;color:#64748b}.rank-name{font-weight:800}.rank-id{color:#94a3b8;font-size:10px}.rank-score{font-weight:900}.empty{padding:22px;color:#94a3b8;text-align:center}.modal{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:14px;background:rgba(15,23,42,.78)}.modal.hidden{display:none}.game-box{width:min(100%,470px);max-height:94vh;overflow:auto;padding:18px;border-radius:18px;background:#fff;text-align:center}.game-head{display:flex;align-items:center;margin-bottom:12px}.game-head h2{margin:0;font-size:18px}.close{margin-left:auto;width:34px;height:34px;border:0;border-radius:9px;background:#e5e7eb;font-size:20px}.game-status{min-height:28px;margin:10px 0;color:#475569;font-size:13px;font-weight:700}.play-button{padding:11px 18px;border:0;border-radius:11px;background:#111827;color:#fff;font-weight:800}.reaction-pad{height:260px;display:grid;place-items:center;border-radius:16px;background:#ef4444;color:#fff;font-size:22px;font-weight:900;user-select:none;cursor:pointer}.reaction-pad.waiting{background:#f59e0b}.reaction-pad.ready{background:#22c55e}.game-canvas{display:block;width:min(100%,360px);height:auto;margin:auto;border-radius:12px;background:#0f172a;touch-action:none}.controls{display:grid;grid-template-columns:repeat(3,58px);justify-content:center;gap:6px;margin:12px auto}.controls button,.side-controls button{min-height:44px;border:0;border-radius:10px;background:#e2e8f0;color:#111827;font-weight:900;touch-action:none}.controls .up{grid-column:2}.controls .left{grid-column:1;grid-row:2}.controls .down{grid-column:2;grid-row:2}.controls .right{grid-column:3;grid-row:2}.side-controls{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px auto;max-width:300px}.mole-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:350px;margin:auto}.mole{aspect-ratio:1;border:0;border-radius:50%;background:#cbd5e1;color:transparent}.mole.active{background:#4f46e5;color:#fff}.result{padding:20px;border-radius:14px;background:#f8fafc}.result strong{display:block;margin-bottom:8px;font-size:24px}.result-actions{display:flex;justify-content:center;gap:7px;margin-top:14px}.result-actions button{padding:9px 13px;border:0;border-radius:9px;background:#111827;color:#fff;font-weight:800}.result-actions .secondary{background:#e2e8f0;color:#334155}@media(max-width:650px){.header{height:54px;padding:0 10px}.header h1{font-size:15px}.container{margin:10px auto;padding:0 8px}.intro h2{font-size:19px}.games{gap:8px}.game-card{padding:13px;border-radius:12px}.game-name{font-size:14px}.game-desc,.best{font-size:10px}.ranking{margin-top:10px;padding:13px}.ranking h2{font-size:15px}.ranking select{max-width:135px;font-size:11px}.modal{align-items:flex-end;padding:0}.game-box{max-height:92vh;padding:14px 10px calc(14px + env(safe-area-inset-bottom));border-radius:18px 18px 0 0}.reaction-pad{height:230px}.game-status{font-size:11px}}
</style></head><body><header class="header"><h1>OURCOM 미니게임</h1><button onclick="location.href='/main.html'">홈</button></header><main class="container"><section class="intro"><h2>게임센터</h2><p>게임을 플레이하고 친구들과 최고점수를 겨뤄보세요.</p></section><section class="games"><button class="game-card" onclick="openGame('reaction')"><div class="game-name">반응속도</div><div class="game-desc">화면이 초록색으로 바뀌는 순간 누르세요.</div><div class="best" data-best="reaction">내 최고점수 -</div></button><button class="game-card" onclick="openGame('snake')"><div class="game-name">뱀 게임</div><div class="game-desc">벽과 몸을 피하면서 먹이를 모으세요.</div><div class="best" data-best="snake">내 최고점수 -</div></button><button class="game-card" onclick="openGame('obstacle')"><div class="game-name">장애물 피하기</div><div class="game-desc">좌우로 움직여 떨어지는 장애물을 피하세요.</div><div class="best" data-best="obstacle">내 최고점수 -</div></button><button class="game-card" onclick="openGame('mole')"><div class="game-name">두더지 잡기</div><div class="game-desc">20초 동안 나타나는 목표를 빠르게 누르세요.</div><div class="best" data-best="mole">내 최고점수 -</div></button></section><section class="ranking"><div class="ranking-head"><h2>랭킹</h2><select id="rankingGame" onchange="loadRankings()"><option value="all">종합 랭킹</option><option value="reaction">반응속도</option><option value="snake">뱀 게임</option><option value="obstacle">장애물 피하기</option><option value="mole">두더지 잡기</option></select></div><div id="rankingList" class="empty">불러오는 중...</div></section></main><div id="gameModal" class="modal hidden" onclick="modalBackground(event)"><div class="game-box"><div class="game-head"><h2 id="gameTitle"></h2><button class="close" onclick="closeGame()" aria-label="닫기">×</button></div><div id="gameContent"></div><div id="gameStatus" class="game-status"></div></div></div><script>
const GAME_NAMES={reaction:"반응속도",snake:"뱀 게임",obstacle:"장애물 피하기",mole:"두더지 잡기"};let activeGame=null,runToken=null,cleanups=[];
async function api(url,options){const response=await fetch(url,options),data=await response.json();if(response.status===401){location.href="/";throw Error("로그인이 필요합니다.")}if(!response.ok||!data.success)throw Error(data.message||"요청에 실패했습니다.");return data}
function addCleanup(fn){cleanups.push(fn)}function stopCurrent(){cleanups.splice(0).forEach(fn=>{try{fn()}catch{}});runToken=null}function status(text){document.getElementById("gameStatus").textContent=text}
async function loadRankings(){const game=document.getElementById("rankingGame").value,list=document.getElementById("rankingList");list.className="empty";list.textContent="불러오는 중...";try{const data=await api(`/api/games/rankings?game=${game}`);document.querySelectorAll("[data-best]").forEach(box=>{const score=data.bestScores[box.dataset.best];box.textContent=`내 최고점수 ${score??"-"}`});if(!data.rankings.length){list.className="empty";list.textContent="아직 등록된 점수가 없습니다.";return}list.className="";list.innerHTML=data.rankings.map((row,index)=>`<div class="rank-row"><div class="rank-number">${index+1}</div><div><div class="rank-name">${escapeHtml(row.name)}</div><div class="rank-id">@${escapeHtml(row.userId)}</div></div><div class="rank-score">${row.score}점</div></div>`).join("")}catch(error){list.textContent=error.message}}
function escapeHtml(value){const box=document.createElement("div");box.textContent=value??"";return box.innerHTML}
async function openGame(game){stopCurrent();activeGame=game;document.getElementById("gameTitle").textContent=GAME_NAMES[game];document.getElementById("gameModal").classList.remove("hidden");document.getElementById("gameContent").innerHTML=`<button class="play-button" onclick="startGame()">게임 시작</button>`;status("시작 버튼을 눌러주세요.")}
function closeGame(){stopCurrent();document.getElementById("gameModal").classList.add("hidden")}function modalBackground(event){if(event.target===event.currentTarget)closeGame()}
async function startGame(){stopCurrent();status("게임을 준비하는 중...");try{const data=await api("/api/games/start",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({game:activeGame})});runToken=data.token;({reaction:startReaction,snake:startSnake,obstacle:startObstacle,mole:startMole})[activeGame]()}catch(error){status(error.message)}}
async function finishScore(score,message){const token=runToken;stopCurrent();document.getElementById("gameContent").innerHTML=`<div class="result"><strong>${escapeHtml(message)}</strong><span>${score}점</span><div class="result-actions"><button onclick="startGame()">다시 하기</button><button class="secondary" onclick="closeGame()">닫기</button></div></div>`;status(score>0?"점수를 저장하는 중...":"이번 게임은 점수가 없습니다.");if(score<=0)return;try{await api("/api/games/score",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({token,score})});status("랭킹에 점수를 저장했습니다.");await loadRankings()}catch(error){status(error.message)}}
function startReaction(){const content=document.getElementById("gameContent");content.innerHTML='<div id="reactionPad" class="reaction-pad waiting">기다리세요</div>';const pad=document.getElementById("reactionPad"),wait=1500+Math.random()*2500;let readyAt=0;const timer=setTimeout(()=>{readyAt=performance.now();pad.className="reaction-pad ready";pad.textContent="지금 누르세요"},wait);addCleanup(()=>clearTimeout(timer));pad.onclick=()=>{if(!readyAt){clearTimeout(timer);finishScore(0,"너무 빨랐어요");return}const ms=Math.round(performance.now()-readyAt),score=Math.max(1,1000-ms);finishScore(score,`${ms}ms`) };status("초록색으로 바뀌기 전에 누르면 실패합니다.")}
function startSnake(){const content=document.getElementById("gameContent");content.innerHTML='<canvas id="snakeCanvas" class="game-canvas" width="320" height="320"></canvas><div class="controls"><button class="up" data-dir="up">위</button><button class="left" data-dir="left">왼쪽</button><button class="down" data-dir="down">아래</button><button class="right" data-dir="right">오른쪽</button></div>';const canvas=document.getElementById("snakeCanvas"),ctx=canvas.getContext("2d"),size=16,cells=20;let snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}],direction={x:1,y:0},next=direction,food=randomFood(),score=0;function randomFood(){let point;do{point={x:Math.floor(Math.random()*cells),y:Math.floor(Math.random()*cells)}}while(snake?.some(part=>part.x===point.x&&part.y===point.y));return point}function setDirection(name){const dirs={up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}},choice=dirs[name];if(choice&&!(choice.x===-direction.x&&choice.y===-direction.y))next=choice}function draw(){ctx.fillStyle="#0f172a";ctx.fillRect(0,0,320,320);ctx.fillStyle="#f43f5e";ctx.fillRect(food.x*size+2,food.y*size+2,size-4,size-4);ctx.fillStyle="#22c55e";snake.forEach((part,index)=>ctx.fillRect(part.x*size+1,part.y*size+1,size-2,size-2));status(`${score}점`)}function tick(){direction=next;const head={x:snake[0].x+direction.x,y:snake[0].y+direction.y};if(head.x<0||head.y<0||head.x>=cells||head.y>=cells||snake.some(part=>part.x===head.x&&part.y===head.y)){finishScore(score,`게임 종료`);return}snake.unshift(head);if(head.x===food.x&&head.y===food.y){score+=100;food=randomFood()}else snake.pop();draw()}const keyboard=event=>{const map={ArrowUp:"up",ArrowDown:"down",ArrowLeft:"left",ArrowRight:"right"};if(map[event.key]){event.preventDefault();setDirection(map[event.key])}};document.addEventListener("keydown",keyboard);content.querySelectorAll("[data-dir]").forEach(button=>button.onpointerdown=()=>setDirection(button.dataset.dir));const timer=setInterval(tick,115);addCleanup(()=>{clearInterval(timer);document.removeEventListener("keydown",keyboard)});draw()}
function startObstacle(){const content=document.getElementById("gameContent");content.innerHTML='<canvas id="obstacleCanvas" class="game-canvas" width="320" height="420"></canvas><div class="side-controls"><button data-move="left">왼쪽</button><button data-move="right">오른쪽</button></div>';const canvas=document.getElementById("obstacleCanvas"),ctx=canvas.getContext("2d"),player={x:138,y:385,w:44,h:16},obstacles=[],keys={left:false,right:false};let last=performance.now(),spawn=0,start=last,frame=0,ended=false;function control(name,value){keys[name]=value}content.querySelectorAll("[data-move]").forEach(button=>{const name=button.dataset.move;button.onpointerdown=()=>control(name,true);button.onpointerup=button.onpointercancel=()=>control(name,false)});const keyboard=event=>{if(event.key==="ArrowLeft"||event.key==="ArrowRight"){event.preventDefault();control(event.key==="ArrowLeft"?"left":"right",event.type==="keydown")}};document.addEventListener("keydown",keyboard);document.addEventListener("keyup",keyboard);function loop(now){const dt=Math.min(32,now-last);last=now;if(keys.left)player.x-=.28*dt;if(keys.right)player.x+=.28*dt;player.x=Math.max(0,Math.min(320-player.w,player.x));spawn+=dt;if(spawn>Math.max(300,760-(now-start)/70)){spawn=0;const w=35+Math.random()*50;obstacles.push({x:Math.random()*(320-w),y:-20,w,h:16,speed:.16+Math.min(.25,(now-start)/70000)})}for(const obstacle of obstacles)obstacle.y+=obstacle.speed*dt;const hit=obstacles.some(o=>player.x<o.x+o.w&&player.x+player.w>o.x&&player.y<o.y+o.h&&player.y+player.h>o.y);if(hit){ended=true;finishScore(Math.floor((now-start)/10),"충돌했습니다");return}ctx.fillStyle="#0f172a";ctx.fillRect(0,0,320,420);ctx.fillStyle="#38bdf8";ctx.fillRect(player.x,player.y,player.w,player.h);ctx.fillStyle="#f43f5e";obstacles.forEach(o=>ctx.fillRect(o.x,o.y,o.w,o.h));for(let i=obstacles.length-1;i>=0;i--)if(obstacles[i].y>440)obstacles.splice(i,1);status(`${Math.floor((now-start)/10)}점`);frame=requestAnimationFrame(loop)}frame=requestAnimationFrame(loop);addCleanup(()=>{if(!ended)cancelAnimationFrame(frame);document.removeEventListener("keydown",keyboard);document.removeEventListener("keyup",keyboard)})}
function startMole(){const content=document.getElementById("gameContent");content.innerHTML=`<div class="mole-grid">${Array.from({length:9},(_,i)=>`<button class="mole" data-hole="${i}">목표</button>`).join("")}</div>`;const holes=[...content.querySelectorAll(".mole")];let active=-1,hits=0,remaining=20;function move(){holes.forEach(h=>h.classList.remove("active"));let next;do{next=Math.floor(Math.random()*holes.length)}while(next===active);active=next;holes[active].classList.add("active")}holes.forEach((hole,index)=>hole.onclick=()=>{if(index!==active)return;hits++;hole.classList.remove("active");active=-1;status(`${remaining}초 · ${hits*50}점`)});move();const mover=setInterval(move,600),clock=setInterval(()=>{remaining--;status(`${remaining}초 · ${hits*50}점`);if(remaining<=0)finishScore(hits*50,`${hits}번 성공`)},1000);addCleanup(()=>{clearInterval(mover);clearInterval(clock)});status("20초 · 0점")}
loadRankings();
</script></body></html>
