<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>OURCOM 채팅</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;

    font-family:
        Arial,
        "Noto Sans KR",
        sans-serif;

    background: #f5f6f8;
}

.header {

    height: 65px;

    background: #111827;

    color: white;

    display: flex;

    align-items: center;

    padding: 0 20px;

    font-size: 20px;

    font-weight: bold;

}

.back {

    margin-left: auto;

    background: #374151;

    color: white;

    border: none;

    border-radius: 8px;

    padding: 8px 12px;

    cursor: pointer;

}

.chat {

    height:
        calc(100vh - 65px);

    display: flex;

    flex-direction: column;

}

.messages {

    flex: 1;

    overflow-y: auto;

    padding: 20px;

}

.message {

    margin-bottom: 18px;

}

.message.pending { opacity: .62; }
.message.failed .time { color: #ef4444; font-weight: bold; }
.retry-button { margin-left: 6px; border: 0; border-radius: 7px; padding: 4px 7px; color: white; background: #ef4444; cursor: pointer; }
.message-action { margin-left: 5px; padding: 3px 6px; border: 1px solid #d1d5db; border-radius: 7px; background: white; color: #4b5563; font-size: 11px; cursor: pointer; }
.edited-label { margin-left: 5px; color: #9ca3af; font-size: 10px; }
.message.deleted .message-text { color: #9ca3af; font-style: italic; }
.connection-status { display: none; padding: 7px; background: #fef3c7; color: #92400e; text-align: center; font-size: 13px; }

.name {

    font-size: 13px;

    font-weight: bold;

    margin-bottom: 5px;

}

.mine {

    text-align: right;
}

.mine .name {
    color: #4f46e5;
}

.bubble {

    display: inline-block;

    max-width: 70%;

    padding: 10px 14px;

    border-radius: 14px;

    background: white;

    box-shadow:
        0 2px 5px
        rgba(0,0,0,0.05);

    word-break: break-word;

}

.mine .bubble {

    background: #111827;

    color: white;

}

.time {

    display: inline-block;

    margin-left: 7px;

    font-size: 11px;

    color: #999;

}

.read-count {

    display: inline-block;

    margin-left: 6px;

    color: #999;

    font-size: 11px;

    cursor: pointer;

    font-weight: bold;

}

.read-count:hover {

    text-decoration: underline;

}

.reply-button {
    margin-left: 7px; padding: 3px 7px; border: 1px solid #d1d5db;
    border-radius: 8px; background: white; color: #4b5563;
    font-size: 11px; cursor: pointer;
}

.reply-reference {
    display: block; width: 100%; margin-bottom: 7px; padding: 7px 9px;
    border: none; border-left: 3px solid #818cf8; border-radius: 6px;
    background: rgba(99, 102, 241, .10); color: inherit;
    text-align: left; cursor: pointer;
}

.reply-reference strong, .reply-reference span { display: block; }
.reply-reference span { opacity: .75; font-size: 12px; }

.reply-preview {
    display: none; align-items: center; justify-content: space-between;
    padding: 9px 15px; border-top: 1px solid #ddd;
    background: #f5f3ff; font-size: 13px;
}

.reply-preview strong, .reply-preview span { display: block; }
.reply-preview span { color: #6b7280; }
.reply-preview button { border: 0; background: transparent; font-size: 22px; cursor: pointer; }
.reply-highlight { animation: replyFlash 1.4s ease; }
@keyframes replyFlash { 50% { background: #fef3c7; } }

.input-area {

    display: flex;

    padding: 15px;

    background: white;

    border-top:
        1px solid #ddd;

}

#messageInput {

    flex: 1;

    padding: 13px;

    border:
        1px solid #ddd;

    border-radius: 12px;

    font-size: 15px;

    outline: none;

}

#sendButton {

    margin-left: 10px;

    padding: 0 20px;

    border: none;

    border-radius: 12px;

    background: #111827;

    color: white;

    cursor: pointer;

}

.modal {

    display: none;

    position: fixed;

    inset: 0;

    background:
        rgba(0,0,0,0.4);

    align-items: center;

    justify-content: center;

    z-index: 100;

}

.modal-box {

    width: min(90%, 350px);

    background: white;

    border-radius: 18px;

    padding: 25px;

    box-shadow:
        0 10px 40px
        rgba(0,0,0,0.25);

}

.modal-box h3 {

    margin-top: 0;

}

.user-row {

    padding: 9px 0;

    border-bottom:
        1px solid #eee;

}

.close-button {

    width: 100%;

    margin-top: 15px;

    padding: 11px;

    border: none;

    border-radius: 10px;

    background: #111827;

    color: white;

    cursor: pointer;

}

</style>

</head>


<body>


<div class="header">

💬 OURCOM 전체 채팅

<button
    class="back"
    onclick="location.href='/main.html'"
>
    ← 홈
</button>

</div>


<div class="chat">

    <div id="connectionStatus" class="connection-status">서버에 다시 연결하는 중...</div>

    <div
        id="messages"
        class="messages"
    ></div>

    <div id="replyPreview" class="reply-preview">
        <div>
            <strong id="replyPreviewName"></strong>
            <span id="replyPreviewText"></span>
        </div>
        <button type="button" onclick="cancelReply()" aria-label="답장 취소">×</button>
    </div>

    <div class="input-area">

        <input
            id="messageInput"
            type="text"
            placeholder="메시지를 입력하세요..."
            autocomplete="off"
        >

        <button id="sendButton">
            전송
        </button>

    </div>

</div>


<!-- =================================
     읽지 않은 사람
================================= -->

<div
    id="readModal"
    class="modal"
>

    <div class="modal-box">

        <h3>
            👀 읽지 않은 사람
        </h3>

        <div id="readUsers">
            불러오는 중...
        </div>

        <button
            class="close-button"
            onclick="closeReadModal()"
        >
            닫기
        </button>

    </div>

</div>


<script src="/socket.io/socket.io.js"></script>


<script>

let currentUser = null;

let socket = null;

let replyingTo = null;

let readCountTimer = null;
let hasMoreMessages = true;
let loadingOlder = false;
const pendingMessages = new Map();

function scheduleReadCountUpdate() {
    clearTimeout(readCountTimer);
    readCountTimer = setTimeout(updateReadCounts, 120);
}

function watchPendingMessage(clientId) {
    setTimeout(() => {
        const target = Array.from(document.querySelectorAll(".message[data-client-id]"))
            .find(element => element.dataset.clientId === clientId);
        if (!target) return;
        target.classList.remove("pending");
        target.classList.add("failed");
        const time = target.querySelector(".time");
        if (time) time.textContent = "전송 지연";
        if (!target.querySelector(".retry-button")) {
            const retry = document.createElement("button");
            retry.className = "retry-button";
            retry.textContent = "다시 보내기";
            retry.onclick = () => retryPendingMessage(clientId);
            target.appendChild(retry);
        }
    }, 8000);
}

function retryPendingMessage(clientId) {
    const payload = pendingMessages.get(clientId);
    if (!payload || !socket || !socket.connected) return;
    const target = Array.from(document.querySelectorAll(".message[data-client-id]"))
        .find(element => element.dataset.clientId === clientId);
    if (target) {
        target.classList.remove("failed");
        target.classList.add("pending");
        target.querySelector(".retry-button")?.remove();
        const time = target.querySelector(".time");
        if (time) time.textContent = "다시 전송 중";
    }
    socket.emit("group message", payload);
    watchPendingMessage(clientId);
}

function visibleMessageIds() {
    return Array.from(document.querySelectorAll(".message:not(.pending)"))
        .map(element => Number(element.dataset.messageId))
        .filter(Number.isInteger);
}

function startReply(message) {
    replyingTo = { id: message.id, name: message.name, text: message.text };
    document.getElementById("replyPreviewName").textContent = `${replyingTo.name}님에게 답장`;
    document.getElementById("replyPreviewText").textContent = replyingTo.text;
    document.getElementById("replyPreview").style.display = "flex";
    document.getElementById("messageInput").focus();
}

function cancelReply() {
    replyingTo = null;
    document.getElementById("replyPreview").style.display = "none";
}

function scrollToMessage(messageId) {
    const target = document.querySelector(`[data-message-id="${Number(messageId)}"]`);
    if (!target) return;
    target.scrollIntoView({ behavior: "smooth", block: "center" });
    target.classList.remove("reply-highlight");
    void target.offsetWidth;
    target.classList.add("reply-highlight");
    setTimeout(() => target.classList.remove("reply-highlight"), 1400);
}

function appendReplyReference(bubble, message) {
    if (!message.replyToId) return;
    const reference = document.createElement("button");
    reference.type = "button";
    reference.className = "reply-reference";
    reference.dataset.replyToId = message.replyToId;
    const name = document.createElement("strong");
    name.textContent = message.replyToName || "원문";
    const text = document.createElement("span");
    text.textContent = message.replyToText || "삭제된 메시지";
    reference.append(name, text);
    reference.onclick = () => scrollToMessage(message.replyToId);
    bubble.appendChild(reference);
}


/* =====================================
   로그인 확인
===================================== */

async function checkLogin() {

    const response =
        await fetch("/api/me");

    const data =
        await response.json();


    if (!data.loggedIn) {

        location.href = "/";

        return false;

    }


    currentUser =
        data.user;

    return true;

}


/* =====================================
   메시지 HTML 만들기
===================================== */

function createMessageElement(
    message
) {

    const wrapper =
        document.createElement("div");

    wrapper.className =
        "message";

    wrapper.dataset.messageId =
        message.id;

    if (message.clientId && message.pending) {
        wrapper.dataset.clientId = message.clientId;
    }

    if (message.pending) {
        wrapper.classList.add("pending");
    }


    if (
        message.userId ===
        currentUser.id
    ) {

        wrapper.classList.add(
            "mine"
        );

    }


    const name =
        document.createElement("div");

    name.className =
        "name";

    name.textContent =
        message.name;


    const bubble =
        document.createElement("span");

    bubble.className =
        "bubble";

    appendReplyReference(bubble, message);

    const messageText = document.createElement("span");
    messageText.className = "message-text";
    messageText.textContent = message.text;
    bubble.appendChild(messageText);

    if (message.edited && !message.deleted) {
        const edited = document.createElement("span");
        edited.className = "edited-label";
        edited.textContent = "(수정됨)";
        bubble.appendChild(edited);
    }

    if (message.deleted) wrapper.classList.add("deleted");


    const time =
        document.createElement("span");

    time.className =
        "time";

    time.textContent =
        message.time;


    wrapper.appendChild(name);

    wrapper.appendChild(bubble);

    wrapper.appendChild(time);


    /* =================================
       읽음 숫자
    ================================= */

    const count =
        document.createElement("span");

    count.className =
        "read-count";

    count.style.display =
        "none";


    count.onclick =
        () => {

            showUnreadUsers(
                message.id
            );

        };


    wrapper.appendChild(count);

    const replyButton = document.createElement("button");
    replyButton.type = "button";
    replyButton.className = "reply-button";
    replyButton.textContent = "↩ 답장";
    replyButton.onclick = () => startReply(message);
    replyButton.disabled = Boolean(message.pending || message.deleted);
    wrapper.appendChild(replyButton);

    if (message.userId === currentUser.id && !message.pending && !message.deleted) {
        const actions = document.createElement("span");
        actions.className = "owner-actions";
        const edit = document.createElement("button");
        edit.className = "message-action";
        edit.textContent = "수정";
        edit.onclick = () => editMessage(message);
        const remove = document.createElement("button");
        remove.className = "message-action";
        remove.textContent = "삭제";
        remove.onclick = () => deleteMessage(message);
        actions.append(edit, remove);
        wrapper.appendChild(actions);
    }


    return wrapper;

}

function editMessage(message) {
    const element = document.querySelector(`[data-message-id="${Number(message.id)}"]`);
    const current = element?.querySelector(".message-text")?.textContent || message.text;
    const text = prompt("수정할 메시지를 입력하세요.", current);
    if (text === null || !text.trim() || text.trim() === current) return;
    socket.emit("edit group message", { messageId: message.id, text: text.trim() });
}

function deleteMessage(message) {
    if (!confirm("이 메시지를 삭제할까요?")) return;
    socket.emit("delete group message", { messageId: message.id });
}

function applyMessageUpdate(update) {
    const element = document.querySelector(`[data-message-id="${Number(update.id)}"]`);
    if (element) {
        const text = element.querySelector(".message-text");
        if (text) text.textContent = update.text;
        element.querySelector(".edited-label")?.remove();
        if (update.edited && !update.deleted) {
            const label = document.createElement("span");
            label.className = "edited-label";
            label.textContent = "(수정됨)";
            element.querySelector(".bubble")?.appendChild(label);
        }
        if (update.deleted) {
            element.classList.add("deleted");
            element.querySelector(".owner-actions")?.remove();
            const reply = element.querySelector(".reply-button");
            if (reply) reply.disabled = true;
        }
    }
    document.querySelectorAll(`[data-reply-to-id="${Number(update.id)}"] span`)
        .forEach(reference => { reference.textContent = update.text; });
}


/* =====================================
   메시지 추가
===================================== */

function addMessage(message) {

    const container =
        document.getElementById(
            "messages"
        );


    if (Number.isInteger(Number(message.id)) &&
        document.querySelector(`[data-message-id="${Number(message.id)}"]`)) return;

    const element =
        createMessageElement(
            message
        );


    container.appendChild(element);


    container.scrollTop =
        container.scrollHeight;

}

function prependMessages(messages) {
    const container = document.getElementById("messages");
    const oldHeight = container.scrollHeight;
    const fragment = document.createDocumentFragment();
    messages.forEach(message => {
        if (!document.querySelector(`[data-message-id="${Number(message.id)}"]`)) {
            fragment.appendChild(createMessageElement(message));
        }
    });
    container.insertBefore(fragment, container.firstChild);
    container.scrollTop = container.scrollHeight - oldHeight;
}

async function loadOlderMessages() {
    if (!hasMoreMessages || loadingOlder) return;
    const firstId = visibleMessageIds().sort((a, b) => a - b)[0];
    if (!firstId) return;
    loadingOlder = true;
    try {
        const response = await fetch(`/api/group-messages?before=${firstId}`);
        const data = await response.json();
        if (data.success) {
            prependMessages(data.messages);
            hasMoreMessages = data.hasMore;
            markMessagesRead(data.messages);
        }
    } finally {
        loadingOlder = false;
    }
}


/* =====================================
   읽음 숫자 갱신
===================================== */

async function updateReadCounts() {

    const ids = visibleMessageIds();
    if (!ids.length) return;

    const response =
        await fetch(
            `/api/group-unread-counts?ids=${ids.join(",")}`
        );

    const data =
        await response.json();


    if (!data.success) {
        return;
    }


    document
        .querySelectorAll(".message")
        .forEach(element => {

            const id =
                Number(
                    element.dataset.messageId
                );

            const count =
                data.counts[id] ?? 0;

            const countElement =
                element.querySelector(
                    ".read-count"
                );


            /*
             * 현재 로그인한 사람은
             * 자기 메시지를 읽을 필요가 없으므로
             * 숫자 계산에서 제외하도록 서버를
             * 수정하지 않고 여기서 보정한다.
             */

            if (
                count > 0
            ) {

                countElement.textContent =
                    count;

                countElement.style.display =
                    "inline-block";

            }
            else {

                countElement.style.display =
                    "none";

            }

        });

}


/* =====================================
   안 읽은 사람 보기
===================================== */

async function showUnreadUsers(
    messageId
) {

    const response =
        await fetch(
            `/api/group-message/${messageId}/unread-users`
        );

    const data =
        await response.json();


    const container =
        document.getElementById(
            "readUsers"
        );


    if (
        !data.success ||
        data.users.length === 0
    ) {

        container.innerHTML =
            `
            <div class="user-row">
                🟢 모두 읽었습니다!
            </div>
            `;

    }
    else {

        container.innerHTML =
            data.users
                .map(
                    user =>
                        `
                        <div class="user-row">
                            🔴 ${escapeHtml(
                                user.name
                            )}
                        </div>
                        `
                )
                .join("");

    }


    document.getElementById(
        "readModal"
    ).style.display =
        "flex";

}


/* =====================================
   모달 닫기
===================================== */

function closeReadModal() {

    document.getElementById(
        "readModal"
    ).style.display =
        "none";

}


/* =====================================
   HTML 문자 보호
===================================== */

function escapeHtml(text) {

    const div =
        document.createElement(
            "div"
        );

    div.textContent =
        text;

    return div.innerHTML;

}


/* =====================================
   현재 화면의 메시지를 읽음 처리
===================================== */

async function markMessagesRead(messages) {

    if (!socket) {
        return;
    }


    const ids =
        (Array.isArray(messages) ? messages : [])
            .filter(
                message =>
                    message.userId !==
                    currentUser.id
            )
            .map(
                message =>
                    message.id
            );


    if (ids.length > 0) {

        socket.emit(
            "mark messages read",
            ids
        );

    } else {
        scheduleReadCountUpdate();
    }

}


/* =====================================
   채팅 시작
===================================== */

async function startChat() {

    const loggedIn =
        await checkLogin();

    if (!loggedIn) {
        return;
    }


    socket = io();


    /* ================================
       기존 메시지
    ================================= */

    socket.on(
        "group history",
        history => {

            const container =
                document.getElementById(
                    "messages"
                );

            container.innerHTML =
                "";


            const messages = Array.isArray(history) ? history : history.messages;
            hasMoreMessages = Boolean(history && history.hasMore);

            messages.forEach(
                addMessage
            );

            markMessagesRead(messages);

        }
    );


    /* ================================
       새 메시지
    ================================= */

    socket.on(
        "group message",
        message => {
            const pending = Array.from(document.querySelectorAll(".message[data-client-id]"))
                .find(element => element.dataset.clientId === message.clientId);

            if (pending && message.userId === currentUser.id) {
                pending.replaceWith(createMessageElement(message));
                pendingMessages.delete(message.clientId);
            } else {
                addMessage(message);
            }

            if (message.userId !== currentUser.id) {
                markMessagesRead([message]);
            } else {
                scheduleReadCountUpdate();
            }

        }
    );


    /* ================================
       읽음 상태 변화
    ================================= */

    socket.on(
        "read-status-update",
        () => {

            scheduleReadCountUpdate();

        }
    );

    socket.on("group message updated", applyMessageUpdate);

    socket.on("connect", () => {
        document.getElementById("connectionStatus").style.display = "none";
        socket.emit("join group");
    });
    socket.on("disconnect", () => {
        document.getElementById("connectionStatus").style.display = "block";
    });
    socket.on("connect_error", () => {
        document.getElementById("connectionStatus").style.display = "block";
    });


    /* ================================
       전송
    ================================= */

    function sendMessage() {

        const input =
            document.getElementById(
                "messageInput"
            );


        const text =
            input.value.trim();


        if (!text) {
            return;
        }

        if (!socket || !socket.connected) {
            alert("채팅 서버에 연결 중입니다. 잠시 후 다시 보내주세요.");
            return;
        }

        const clientId = `${Date.now()}-${Math.random().toString(36).slice(2)}`;
        const reply = replyingTo;

        addMessage({
            id: `pending-${clientId}`,
            clientId,
            pending: true,
            userId: currentUser.id,
            name: currentUser.name,
            text,
            time: "전송 중",
            replyToId: reply ? reply.id : null,
            replyToName: reply ? reply.name : null,
            replyToText: reply ? reply.text : null
        });


        const payload = { text, replyToId: reply ? reply.id : null, clientId };
        pendingMessages.set(clientId, payload);
        socket.emit("group message", payload);

        watchPendingMessage(clientId);


        input.value = "";

        cancelReply();

        input.focus();

    }


    document
        .getElementById("sendButton")
        .addEventListener(
            "click",
            sendMessage
        );

    document.getElementById("messages").addEventListener("scroll", event => {
        if (event.currentTarget.scrollTop < 40) loadOlderMessages();
    });


    document
        .getElementById("messageInput")
        .addEventListener(
            "keydown",
            event => {

                if (
                    event.key === "Enter"
                ) {

                    sendMessage();

                }

            }
        );


    /*
     * 채팅방에 들어왔으므로
     * 상대방 메시지를 읽음 처리
     */

}


/* =====================================
   시작
===================================== */

startChat();

</script>

</body>

</html>
