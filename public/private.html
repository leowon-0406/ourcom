<!DOCTYPE html>
<html lang="ko">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>OURCOM 1:1 채팅</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;

            font-family:
                Arial,
                "Noto Sans KR",
                sans-serif;

            background: #f5f6f8;
        }

        .header {
            height: 70px;

            background: #111827;
            color: white;

            display: flex;
            align-items: center;

            padding: 0 20px;
        }

        .header-info {
            display: flex;
            flex-direction: column;
        }

        .title {
            font-size: 18px;
            font-weight: bold;
        }

        .subtitle {
            margin-top: 3px;

            font-size: 12px;

            color: #9ca3af;
        }

        .back {
            margin-left: auto;

            border: none;
            border-radius: 10px;

            padding: 9px 13px;

            background: #374151;
            color: white;

            cursor: pointer;
        }

        .chat {
            height: calc(100vh - 70px);

            display: flex;
            flex-direction: column;
        }

        .messages {
            flex: 1;

            overflow-y: auto;

            padding: 20px;
        }

        .message {
            margin-bottom: 15px;
        }

        .message.mine {
            text-align: right;
        }

        .bubble {
            display: inline-block;

            max-width: 70%;

            padding: 11px 14px;

            border-radius: 15px;

            background: white;

            box-shadow:
                0 2px 5px
                rgba(0,0,0,0.05);

            word-break: break-word;
        }

        .mine .bubble {
            background: #111827;
            color: white;
        }

        .time {
            margin-left: 7px;

            font-size: 11px;

            color: #999;
        }

        .input-area {
            display: flex;

            padding: 15px;

            background: white;

            border-top:
                1px solid #ddd;
        }

        #messageInput {
            flex: 1;

            padding: 13px;

            border:
                1px solid #ddd;

            border-radius: 12px;

            font-size: 15px;

            outline: none;
        }

        #sendButton {
            margin-left: 10px;

            padding: 0 20px;

            border: none;

            border-radius: 12px;

            background: #111827;
            color: white;

            cursor: pointer;
        }

        #sendButton:hover {
            background: #1f2937;
        }

        .empty {
            text-align: center;

            color: #aaa;

            margin-top: 30px;
        }

    </style>

</head>


<body>


<div class="header">

    <div class="header-info">

        <div
            id="friendName"
            class="title"
        >
            불러오는 중...
        </div>

        <div class="subtitle">
            1:1 채팅
        </div>

    </div>


    <button
        class="back"
        onclick="location.href='/friends.html'"
    >
        ← 친구
    </button>

</div>


<div class="chat">

    <div
        id="messages"
        class="messages"
    ></div>


    <div class="input-area">

        <input
            id="messageInput"
            type="text"
            placeholder="메시지를 입력하세요..."
            autocomplete="off"
        >

        <button id="sendButton">
            전송
        </button>

    </div>

</div>


<script src="/socket.io/socket.io.js"></script>


<script>

let currentUser = null;

let friendId = null;

let socket = null;


/* =========================================
   친구 ID
========================================= */

const params =
    new URLSearchParams(
        window.location.search
    );

friendId =
    params.get("id");


if (!friendId) {

    location.href =
        "/friends.html";

}


/* =========================================
   로그인 확인
========================================= */

async function checkLogin() {

    try {

        const response =
            await fetch("/api/me");

        const data =
            await response.json();


        if (!data.loggedIn) {

            location.href = "/";

            return false;

        }


        currentUser =
            data.user;

        return true;

    }

    catch (error) {

        console.error(
            "로그인 확인 오류:",
            error
        );

        return false;

    }

}


/* =========================================
   친구 정보
========================================= */

async function loadFriend() {

    const response =
        await fetch("/api/users");

    const data =
        await response.json();


    const friend =
        data.users.find(
            user =>
                user.id === friendId
        );


    if (!friend) {

        alert(
            "친구를 찾을 수 없습니다."
        );

        location.href =
            "/friends.html";

        return false;

    }


    document
        .getElementById("friendName")
        .textContent =
        friend.name;


    return true;

}


/* =========================================
   메시지 출력
========================================= */

function addMessage(message) {

    const container =
        document.getElementById(
            "messages"
        );


    const empty =
        container.querySelector(
            ".empty"
        );


    if (empty) {
        empty.remove();
    }


    const div =
        document.createElement(
            "div"
        );


    div.className =
        "message";


    if (
        message.fromId ===
        currentUser.id
    ) {

        div.classList.add(
            "mine"
        );

    }


    const bubble =
        document.createElement(
            "span"
        );

    bubble.className =
        "bubble";

    bubble.textContent =
        message.text;


    const time =
        document.createElement(
            "span"
        );

    time.className =
        "time";

    time.textContent =
        message.time;


    div.appendChild(
        bubble
    );

    div.appendChild(
        time
    );


    container.appendChild(
        div
    );


    container.scrollTop =
        container.scrollHeight;

}


/* =========================================
   대화 기록 불러오기
========================================= */

function showHistory(messages) {

    const container =
        document.getElementById(
            "messages"
        );


    container.innerHTML = "";


    if (
        !Array.isArray(messages) ||
        messages.length === 0
    ) {

        container.innerHTML = `
            <div class="empty">
                아직 대화가 없습니다.<br>
                먼저 메시지를 보내보세요!
            </div>
        `;

        return;

    }


    messages.forEach(
        message => {

            addMessage(
                message
            );

        }
    );

}


/* =========================================
   읽음 처리
========================================= */

async function markMessagesRead(
    messages
) {

    if (
        !Array.isArray(messages) ||
        messages.length === 0
    ) {

        return;

    }


    const unreadIds =
        messages
            .filter(
                message =>
                    message.toId ===
                    currentUser.id
            )
            .map(
                message =>
                    message.id
            );


    if (
        unreadIds.length === 0
    ) {

        return;

    }


    try {

        await fetch(
            "/api/private-read",
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body:
                    JSON.stringify({
                        messageIds:
                            unreadIds
                    })
            }
        );

    }

    catch (error) {

        console.error(
            "읽음 처리 오류:",
            error
        );

    }

}


/* =========================================
   채팅 시작
========================================= */

async function startChat() {

    const loggedIn =
        await checkLogin();


    if (!loggedIn) {
        return;
    }


    const friendLoaded =
        await loadFriend();


    if (!friendLoaded) {
        return;
    }


    socket = io();


    /* =====================================
       연결
    ===================================== */

    socket.on(
        "connect",
        () => {

            console.log(
                "OURCOM 1:1 채팅 연결 완료"
            );


            socket.emit(
                "join private",
                friendId
            );

        }
    );


    /* =====================================
       이전 대화
    ===================================== */

    socket.on(
        "private history",
        history => {

            /*
             * 서버는
             *
             * {
             *     user: {...},
             *     messages: [...]
             * }
             *
             * 형태로 보냄
             */

            const messages =
                history &&
                Array.isArray(
                    history.messages
                )
                    ? history.messages
                    : [];


            showHistory(
                messages
            );


            /*
             * 이전에 받은 메시지
             * 읽음 처리
             */

            markMessagesRead(
                messages
            );

        }
    );


    /* =====================================
       실시간 메시지
    ===================================== */

    socket.on(
        "private message",
        message => {

            /*
             * 현재 대화 상대와 관련된
             * 메시지만 표시
             */

            const related =
                (
                    message.fromId ===
                        currentUser.id &&
                    message.toId ===
                        friendId
                )
                ||
                (
                    message.fromId ===
                        friendId &&
                    message.toId ===
                        currentUser.id
                );


            if (!related) {
                return;
            }


            addMessage(
                message
            );


            /*
             * 상대방이 보낸 메시지면
             * 즉시 읽음 처리
             */

            if (
                message.fromId ===
                friendId
            ) {

                markMessagesRead([
                    message
                ]);

            }

        }
    );


    /* =====================================
       메시지 보내기
    ===================================== */

    function sendMessage() {

        const input =
            document.getElementById(
                "messageInput"
            );


        const text =
            input.value.trim();


        if (!text) {
            return;
        }


        if (
            !socket ||
            !socket.connected
        ) {

            alert(
                "채팅 서버에 연결되지 않았습니다."
            );

            return;

        }


        socket.emit(
            "private message",
            {
                toId:
                    friendId,

                text:
                    text
            }
        );


        input.value = "";

        input.focus();

    }


    document
        .getElementById(
            "sendButton"
        )
        .addEventListener(
            "click",
            sendMessage
        );


    document
        .getElementById(
            "messageInput"
        )
        .addEventListener(
            "keydown",
            event => {

                if (
                    event.key ===
                    "Enter"
                ) {

                    event.preventDefault();

                    sendMessage();

                }

            }
        );

}


startChat();

</script>

</body>

</html>
