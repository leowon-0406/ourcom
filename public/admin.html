<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="theme-color" content="#111827">
<link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/icons/ourcom-192.png"><script defer src="/pwa.js"></script>
<title>OURCOM 관리자</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f8;color:#111827;font-family:Arial,"Noto Sans KR",sans-serif}.header{height:64px;padding:0 20px;display:flex;align-items:center;background:#111827;color:#fff;font-size:19px;font-weight:800}.header button{margin-left:auto}.container{max-width:900px;margin:22px auto;padding:0 16px}.box{margin-bottom:16px;padding:20px;border-radius:16px;background:#fff;box-shadow:0 4px 16px rgba(0,0,0,.05)}h2{margin:0 0 14px;font-size:19px}.form{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:8px}input{min-width:0;padding:11px;border:1px solid #d1d5db;border-radius:9px;font-size:14px}button{padding:10px 13px;border:0;border-radius:9px;background:#111827;color:#fff;font-weight:700;cursor:pointer}.secondary{background:#4b5563}.danger{background:#dc2626}.approve{background:#15803d}.message{min-height:18px;margin-top:9px;font-size:13px}.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #e5e7eb}.row:last-child{border:0}.identity{min-width:0;flex:1}.name{font-weight:700}.meta{margin-top:4px;color:#6b7280;font-size:12px}.status{display:inline-flex;align-items:center;gap:5px;font-size:12px}.status::before{content:"";width:8px;height:8px;border-radius:50%;background:#9ca3af}.status.online::before{background:#22c55e}.actions{display:flex;flex-wrap:wrap;gap:6px}.empty{padding:18px 0;color:#6b7280;text-align:center}@media(max-width:650px){.header{height:54px;padding:0 11px;font-size:16px}.container{margin:10px auto;padding:0 9px}.box{padding:13px;border-radius:12px}h2{font-size:16px}.form{grid-template-columns:1fr 1fr}.form input[type=password]{grid-column:1/3}.form button{grid-column:1/3}.row{align-items:flex-start;padding:10px 0}.actions{justify-content:flex-end}.actions button{padding:7px 8px;font-size:11px}.name{font-size:13px}.meta,.status{font-size:10px}}
</style></head>
<body><header class="header">OURCOM 관리자<button class="secondary" onclick="location.href='/main.html'">홈</button></header>
<main class="container">
<section class="box"><h2>가입 승인 요청</h2><div id="requests">불러오는 중...</div></section>
<section class="box"><h2>계정 직접 생성</h2><div class="form"><input id="name" maxlength="40" placeholder="이름"><input id="id" maxlength="30" placeholder="아이디"><input id="password" type="password" maxlength="100" placeholder="비밀번호"><button onclick="createUser()">생성</button></div><div id="message" class="message"></div></section>
<section class="box"><h2>사용자 및 활동 상태</h2><div id="users">불러오는 중...</div></section>
</main>
<script src="/socket.io/socket.io.js"></script><script>
const escapeHtml=value=>{const d=document.createElement("div");d.textContent=value??"";return d.innerHTML};
async function api(url,options){const response=await fetch(url,options);const data=await response.json();if(!response.ok||!data.success)throw new Error(data.message||"요청에 실패했습니다.");return data}
async function checkAdmin(){const data=await fetch("/api/me").then(r=>r.json());if(!data.loggedIn||data.user.role!=="admin")location.href="/"}
function relativeTime(value){if(!value)return"기록 없음";const seconds=Math.max(0,Math.floor((Date.now()-new Date(value))/1000));if(seconds<60)return"방금 전";if(seconds<3600)return`${Math.floor(seconds/60)}분 전`;if(seconds<86400)return`${Math.floor(seconds/3600)}시간 전`;return new Date(value).toLocaleString("ko-KR")}
async function loadRequests(){const box=document.getElementById("requests");try{const data=await api("/api/admin/registration-requests");box.innerHTML="";if(!data.requests.length){box.className="empty";box.textContent="대기 중인 가입 신청이 없습니다.";return}box.className="";data.requests.forEach(request=>{const row=document.createElement("div");row.className="row";row.innerHTML=`<div class="identity"><div class="name">${escapeHtml(request.name)}</div><div class="meta">@${escapeHtml(request.id)} · ${new Date(request.createdAt).toLocaleString("ko-KR")}</div></div><div class="actions"><button class="approve">승인</button><button class="danger">거절</button></div>`;const [approve,reject]=row.querySelectorAll("button");approve.onclick=()=>review(request.id,"approve");reject.onclick=()=>review(request.id,"reject");box.appendChild(row)})}catch(error){box.textContent=error.message}}
async function review(id,action){if(!confirm(action==="approve"?`@${id} 가입을 승인할까요?`:`@${id} 가입을 거절할까요?`))return;try{await api(`/api/admin/registration-requests/${encodeURIComponent(id)}/${action}`,{method:"POST"});await Promise.all([loadRequests(),loadUsers()])}catch(error){alert(error.message)}}
async function createUser(){const message=document.getElementById("message");const body={name:document.getElementById("name").value.trim(),id:document.getElementById("id").value.trim(),password:document.getElementById("password").value};try{await api("/api/admin/users",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});message.style.color="#15803d";message.textContent="계정을 생성했습니다.";["name","id","password"].forEach(id=>document.getElementById(id).value="");await loadUsers()}catch(error){message.style.color="#dc2626";message.textContent=error.message}}
async function loadUsers(){const box=document.getElementById("users");try{const data=await api("/api/admin/users");box.innerHTML="";if(!data.users.length){box.className="empty";box.textContent="등록된 사용자가 없습니다.";return}box.className="";data.users.forEach(user=>{const row=document.createElement("div");row.className="row";row.innerHTML=`<div class="identity"><div class="name">${escapeHtml(user.name)}</div><div class="meta">@${escapeHtml(user.id)}</div><div class="status ${user.online?"online":""}">${user.online?"현재 활동 중":`마지막 활동 ${relativeTime(user.lastActiveAt)}`}</div></div><div class="actions"><button class="secondary">ID 수정</button><button class="danger">삭제</button></div>`;const [edit,remove]=row.querySelectorAll("button");edit.onclick=()=>changeId(user.id);remove.onclick=()=>deleteUser(user.id);box.appendChild(row)})}catch(error){box.textContent=error.message}}
async function changeId(oldId){const newId=prompt("새 아이디를 입력하세요.",oldId);if(newId===null||newId.trim()===oldId)return;try{await api(`/api/admin/users/${encodeURIComponent(oldId)}/id`,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({newId:newId.trim()})});alert("아이디를 변경했습니다. 해당 사용자는 다시 로그인해야 합니다.");await loadUsers()}catch(error){alert(error.message)}}
async function deleteUser(id){if(!confirm(`@${id} 계정을 삭제할까요? 채팅 기록도 함께 삭제될 수 있습니다.`))return;try{await api(`/api/admin/users/${encodeURIComponent(id)}`,{method:"DELETE"});await loadUsers()}catch(error){alert(error.message)}}
checkAdmin().then(()=>Promise.all([loadRequests(),loadUsers()]));const adminSocket=io();adminSocket.on("registration request",loadRequests);adminSocket.on("friends updated",()=>Promise.all([loadRequests(),loadUsers()]));setInterval(loadUsers,15000);
</script></body></html>
