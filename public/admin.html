<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">
<meta name="theme-color" content="#111827">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/ourcom-192.png">
<script defer src="/pwa.js"></script>

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>OURCOM 관리자</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, "Noto Sans KR", sans-serif;
            background: #f5f6f8;
        }

        .header {
            height: 70px;
            background: #111827;
            color: white;

            display: flex;
            align-items: center;

            padding: 0 30px;

            font-size: 20px;
            font-weight: bold;
        }

        .container {
            max-width: 900px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .box {
            background: white;
            padding: 25px;
            border-radius: 18px;
            margin-bottom: 20px;

            box-shadow:
                0 5px 20px
                rgba(0,0,0,0.05);
        }

        h2 {
            margin-top: 0;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 12px;

            border: 1px solid #ddd;
            border-radius: 10px;

            font-size: 15px;
        }

        button {
            padding: 12px 18px;

            border: none;
            border-radius: 10px;

            background: #111827;
            color: white;

            cursor: pointer;
        }

        button:hover {
            background: #374151;
        }

        .user {
            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 15px;

            border-bottom: 1px solid #eee;
        }

        .user:last-child {
            border-bottom: none;
        }

        .delete {
            background: #dc2626;
        }

        .delete:hover {
            background: #b91c1c;
        }

        .message {
            margin-top: 12px;
            font-size: 14px;
        }

        .back {
            background: #4b5563;
            margin-bottom: 20px;
        }

    </style>

</head>

<body>

<div class="header">
    👑 OURCOM 관리자
</div>


<div class="container">

    <button
        class="back"
        onclick="location.href='/main.html'"
    >
        ← 메인으로
    </button>


    <!-- 계정 생성 -->

    <div class="box">

        <h2>👤 친구 계정 만들기</h2>

        <input
            id="name"
            type="text"
            placeholder="이름"
        >

        <input
            id="id"
            type="text"
            placeholder="아이디"
        >

        <input
            id="password"
            type="password"
            placeholder="비밀번호"
        >

        <button onclick="createUser()">
            계정 생성
        </button>

        <div
            id="message"
            class="message"
        ></div>

    </div>


    <!-- 사용자 목록 -->

    <div class="box">

        <h2>👥 등록된 사용자</h2>

        <div id="users">
            불러오는 중...
        </div>

    </div>

</div>


<script>

async function checkAdmin() {

    const response =
        await fetch("/api/me");

    const data =
        await response.json();

    if (
        !data.loggedIn ||
        data.user.role !== "admin"
    ) {

        location.href = "/";

    }

}


async function createUser() {

    const name =
        document.getElementById("name").value.trim();

    const id =
        document.getElementById("id").value.trim();

    const password =
        document.getElementById("password").value;

    const message =
        document.getElementById("message");


    if (!name || !id || !password) {

        message.style.color = "red";

        message.textContent =
            "모든 항목을 입력해주세요.";

        return;

    }


    const response =
        await fetch(
            "/api/admin/users",
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({
                    name,
                    id,
                    password
                })
            }
        );


    const data =
        await response.json();


    if (data.success) {

        message.style.color = "green";

        message.textContent =
            data.message;

        document.getElementById("name").value = "";
        document.getElementById("id").value = "";
        document.getElementById("password").value = "";

        loadUsers();

    } else {

        message.style.color = "red";

        message.textContent =
            data.message;

    }

}


async function loadUsers() {

    const response =
        await fetch("/api/admin/users");

    const data =
        await response.json();

    const container =
        document.getElementById("users");


    if (!data.users.length) {

        container.textContent =
            "등록된 친구가 없습니다.";

        return;

    }


    container.innerHTML =
        data.users.map(user => `

            <div class="user">

                <div>
                    <strong>${user.name}</strong>
                    <br>
                    <small>@${user.id}</small>
                </div>

                <button
                    class="delete"
                    onclick="deleteUser('${user.id}')"
                >
                    삭제
                </button>

            </div>

        `).join("");

}


async function deleteUser(id) {

    if (
        !confirm(
            `"${id}" 계정을 삭제할까요?`
        )
    ) {
        return;
    }


    await fetch(
        `/api/admin/users/${id}`,
        {
            method: "DELETE"
        }
    );


    loadUsers();

}


checkAdmin();
loadUsers();

</script>

</body>
</html>
