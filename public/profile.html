<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/icons/ourcom-192.png"><script defer src="/pwa.js"></script><title>OURCOM 내 설정</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f8;color:#111827;font-family:Arial,"Noto Sans KR",sans-serif}.header{height:62px;padding:0 18px;display:flex;align-items:center;background:#111827;color:#fff;font-size:18px;font-weight:800}.header button{margin-left:auto;padding:9px 12px;border:0;border-radius:9px;background:#374151;color:#fff}.container{max-width:520px;margin:22px auto;padding:0 12px}.card{margin-bottom:14px;padding:22px;border-radius:18px;background:#fff;box-shadow:0 5px 20px rgba(0,0,0,.05)}h2{margin:0 0 16px;font-size:17px}.profile-head{display:flex;align-items:center;gap:16px}.photo{width:105px;height:105px;flex:0 0 105px;display:grid;place-items:center;overflow:hidden;border-radius:50%;background:#e5e7eb;color:#64748b;font-size:36px;font-weight:800}.photo img{width:100%;height:100%;object-fit:cover}.name{font-size:19px;font-weight:800}.id,.safe-note{margin-top:5px;color:#64748b;font-size:12px;line-height:1.5}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:18px}button,.file-label{padding:11px;border:0;border-radius:10px;background:#111827;color:#fff;text-align:center;font-size:13px;font-weight:800;cursor:pointer}.secondary{background:#e5e7eb!important;color:#374151!important}.danger{background:#fee2e2!important;color:#b91c1c!important}button:disabled{opacity:.45;cursor:not-allowed}.field{margin-bottom:11px}.field label{display:block;margin-bottom:6px;font-size:12px;font-weight:800}.field input{width:100%;padding:11px;border:1px solid #d1d5db;border-radius:9px;font-size:14px}.full{width:100%}.status{min-height:18px;margin-top:10px;color:#64748b;font-size:12px}.modal{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:16px;background:rgba(15,23,42,.76)}.modal.hidden{display:none}.crop-box{width:min(100%,370px);padding:18px;border-radius:18px;background:#fff}.crop-box h2{margin-bottom:10px}.crop-wrap{position:relative;width:min(100%,300px);margin:auto;overflow:hidden;border-radius:50%;background:#111827;touch-action:none}.crop-wrap canvas{display:block;width:100%;height:auto}.crop-hint{margin:10px 0;color:#64748b;text-align:center;font-size:11px}.zoom{width:100%}.modal-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}@media(max-width:650px){.header{height:54px;padding:0 10px;font-size:15px}.container{margin:10px auto;padding:0 8px}.card{padding:15px;border-radius:12px}h2{font-size:15px}.photo{width:82px;height:82px;flex-basis:82px;font-size:28px}.name{font-size:16px}.buttons{gap:6px}button,.file-label{padding:10px 7px;font-size:11px}}
</style></head><body>
<header class="header">내 설정<button onclick="location.href='/main.html'">홈</button></header><main class="container">
<section class="card"><h2>프로필</h2><div class="profile-head"><div id="photo" class="photo"></div><div><div id="name" class="name">불러오는 중...</div><div id="userId" class="id"></div><div class="safe-note">사진을 선택한 뒤 확대하고 움직여 원하는 부분을 정할 수 있습니다.</div></div></div><div class="buttons"><label class="file-label" for="profileInput">사진 선택</label><input id="profileInput" type="file" accept="image/jpeg,image/png,image/webp" hidden><button id="saveButton" onclick="savePhoto()" disabled>사진 저장</button><button class="secondary" onclick="removePhoto()">기본 사진으로 변경</button><button class="secondary" onclick="location.reload()">설정 새로고침</button></div><div id="photoStatus" class="status"></div></section>
<section class="card"><h2>비밀번호</h2><div class="safe-note">현재 비밀번호는 누구도 볼 수 없도록 암호화되어 저장됩니다. 본인 확인 후 새 비밀번호로 바꿀 수 있습니다.</div><div class="field"><label for="currentPassword">현재 비밀번호</label><input id="currentPassword" type="password" autocomplete="current-password"></div><div class="field"><label for="newPassword">새 비밀번호 (6자 이상)</label><input id="newPassword" type="password" autocomplete="new-password" maxlength="100"></div><div class="field"><label for="confirmPassword">새 비밀번호 확인</label><input id="confirmPassword" type="password" autocomplete="new-password" maxlength="100"></div><button class="full" onclick="changePassword()">비밀번호 변경</button><div id="passwordStatus" class="status"></div></section>
<section class="card"><h2>계정 관리</h2><div class="safe-note">공용 기기에서는 사용 후 꼭 로그아웃하세요.</div><div class="buttons"><button class="secondary" onclick="location.href='/main.html'">홈으로 이동</button><button class="danger" onclick="logout()">로그아웃</button></div></section></main>
<div id="cropModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="cropTitle"><div class="crop-box"><h2 id="cropTitle">프로필 사진 영역 선택</h2><div id="cropWrap" class="crop-wrap"><canvas id="cropCanvas" width="600" height="600"></canvas></div><div class="crop-hint">사진을 손가락이나 마우스로 움직이고 확대하세요.</div><input id="zoom" class="zoom" type="range" min="1" max="3" value="1" step="0.01" aria-label="사진 확대"><div class="modal-actions"><button class="secondary" onclick="closeCrop()">취소</button><button onclick="applyCrop()">이 영역 사용</button></div></div></div>
<script src="/chat-attachments.js"></script><script>
let selected=null,current=null,cropImage=null,cropUrl="",zoom=1,offsetX=0,offsetY=0,dragging=false,lastX=0,lastY=0;const canvas=document.getElementById("cropCanvas"),ctx=canvas.getContext("2d"),cropWrap=document.getElementById("cropWrap");
function showPhoto(url,name){const box=document.getElementById("photo");box.innerHTML="";if(url){const img=document.createElement("img");img.src=url;img.alt="프로필 사진";box.appendChild(img)}else box.textContent=(name||"?").slice(0,1)}
async function load(){const response=await fetch("/api/profile");const data=await response.json();if(!data.success)return location.href="/";current=data.user;document.getElementById("name").textContent=current.name;document.getElementById("userId").textContent=`@${current.id}`;showPhoto(current.profileImage?.secureUrl,current.name)}
function cropMetrics(){const base=Math.max(canvas.width/cropImage.naturalWidth,canvas.height/cropImage.naturalHeight)*zoom,width=cropImage.naturalWidth*base,height=cropImage.naturalHeight*base,maxX=Math.max(0,(width-canvas.width)/2),maxY=Math.max(0,(height-canvas.height)/2);offsetX=Math.max(-maxX,Math.min(maxX,offsetX));offsetY=Math.max(-maxY,Math.min(maxY,offsetY));return{width,height,x:(canvas.width-width)/2+offsetX,y:(canvas.height-height)/2+offsetY}}
function drawCrop(){if(!cropImage)return;const m=cropMetrics();ctx.clearRect(0,0,canvas.width,canvas.height);ctx.fillStyle="#fff";ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(cropImage,m.x,m.y,m.width,m.height)}
document.getElementById("profileInput").onchange=event=>{const file=event.target.files[0];if(!file)return;if(cropUrl)URL.revokeObjectURL(cropUrl);cropUrl=URL.createObjectURL(file);cropImage=new Image();cropImage.onload=()=>{zoom=1;offsetX=0;offsetY=0;document.getElementById("zoom").value="1";document.getElementById("cropModal").classList.remove("hidden");drawCrop()};cropImage.src=cropUrl;event.target.value=""};document.getElementById("zoom").oninput=event=>{zoom=Number(event.target.value);drawCrop()};
cropWrap.onpointerdown=event=>{dragging=true;lastX=event.clientX;lastY=event.clientY;cropWrap.setPointerCapture(event.pointerId)};cropWrap.onpointermove=event=>{if(!dragging)return;const scale=canvas.width/cropWrap.getBoundingClientRect().width;offsetX+=(event.clientX-lastX)*scale;offsetY+=(event.clientY-lastY)*scale;lastX=event.clientX;lastY=event.clientY;drawCrop()};cropWrap.onpointerup=cropWrap.onpointercancel=()=>{dragging=false};
function closeCrop(){document.getElementById("cropModal").classList.add("hidden")}
function applyCrop(){drawCrop();canvas.toBlob(blob=>{if(!blob)return;selected=new File([blob],`profile-${Date.now()}.jpg`,{type:"image/jpeg"});showPhoto(URL.createObjectURL(blob),current?.name);document.getElementById("saveButton").disabled=false;document.getElementById("photoStatus").textContent="사진 영역을 선택했습니다. 사진 저장을 눌러 완료하세요.";closeCrop()},"image/jpeg",.9)}
async function savePhoto(){if(!selected)return;const button=document.getElementById("saveButton"),status=document.getElementById("photoStatus");button.disabled=true;try{const image=await OurcomFiles.uploadFile(selected,percent=>status.textContent=`업로드 중 ${percent}%`);const response=await fetch("/api/profile",{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({profileImage:image})});const data=await response.json();if(!data.success)throw Error(data.message);selected=null;status.textContent="프로필 사진을 저장했습니다.";await load()}catch(error){status.textContent=error.message||"저장하지 못했습니다."}finally{button.disabled=!selected}}
async function removePhoto(){if(!confirm("프로필 사진을 기본 사진으로 바꿀까요?"))return;const response=await fetch("/api/profile",{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({profileImage:null})});const data=await response.json();document.getElementById("photoStatus").textContent=data.success?"기본 사진으로 변경했습니다.":data.message;selected=null;await load()}
async function changePassword(){const currentPassword=document.getElementById("currentPassword").value,newPassword=document.getElementById("newPassword").value,confirmPassword=document.getElementById("confirmPassword").value,status=document.getElementById("passwordStatus");if(newPassword.length<6)return status.textContent="새 비밀번호를 6자 이상 입력해주세요.";if(newPassword!==confirmPassword)return status.textContent="새 비밀번호 확인이 일치하지 않습니다.";status.textContent="변경 중...";try{const response=await fetch("/api/profile/password",{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({currentPassword,newPassword})});const data=await response.json();status.textContent=data.message;if(data.success)["currentPassword","newPassword","confirmPassword"].forEach(id=>document.getElementById(id).value="")}catch{status.textContent="서버와 연결할 수 없습니다."}}
async function logout(){if(!confirm("로그아웃할까요?"))return;await fetch("/api/logout",{method:"POST"});location.href="/"}load();
</script></body></html>
