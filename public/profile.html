<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/icons/ourcom-192.png"><script defer src="/pwa.js"></script><title>OURCOM 프로필</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f8;color:#111827;font-family:Arial,"Noto Sans KR",sans-serif}.header{height:62px;padding:0 18px;display:flex;align-items:center;background:#111827;color:#fff;font-size:18px;font-weight:800}.header button{margin-left:auto;padding:9px 12px;border:0;border-radius:9px;background:#374151;color:#fff}.card{max-width:430px;margin:28px auto;padding:25px;border-radius:18px;background:#fff;text-align:center;box-shadow:0 5px 20px rgba(0,0,0,.06)}.photo{width:130px;height:130px;margin:0 auto 15px;display:grid;place-items:center;overflow:hidden;border-radius:50%;background:#e5e7eb;color:#64748b;font-size:42px;font-weight:800}.photo img{width:100%;height:100%;object-fit:cover}.name{font-size:20px;font-weight:800}.id{margin-top:5px;color:#64748b;font-size:13px}.buttons{display:grid;gap:8px;margin-top:22px}.buttons button,.file-label{padding:12px;border:0;border-radius:10px;background:#111827;color:#fff;font-weight:800;cursor:pointer}.remove{background:#e5e7eb!important;color:#374151!important}.status{min-height:20px;margin-top:12px;color:#64748b;font-size:12px}@media(max-width:650px){.header{height:54px;padding:0 10px;font-size:15px}.card{margin:12px 9px;padding:18px}.photo{width:105px;height:105px;font-size:34px}.name{font-size:17px}}
</style></head><body><header class="header">내 프로필<button onclick="location.href='/main.html'">홈</button></header><main class="card"><div id="photo" class="photo"></div><div id="name" class="name">불러오는 중...</div><div id="userId" class="id"></div><div class="buttons"><label class="file-label" for="profileInput">프로필 사진 선택</label><input id="profileInput" type="file" accept="image/jpeg,image/png,image/webp,image/gif" hidden><button id="saveButton" onclick="savePhoto()" disabled>사진 저장</button><button class="remove" onclick="removePhoto()">기본 사진으로 변경</button></div><div id="status" class="status"></div></main><script src="/chat-attachments.js"></script><script>
let selected=null;let current=null;function showPhoto(url,name){const box=document.getElementById("photo");box.innerHTML="";if(url){const img=document.createElement("img");img.src=url;img.alt="프로필 사진";box.appendChild(img)}else box.textContent=(name||"?").slice(0,1)}
async function load(){const response=await fetch("/api/profile");const data=await response.json();if(!data.success)return location.href="/";current=data.user;document.getElementById("name").textContent=current.name;document.getElementById("userId").textContent=`@${current.id}`;showPhoto(current.profileImage?.secureUrl,current.name)}
document.getElementById("profileInput").onchange=event=>{selected=event.target.files[0]||null;if(!selected)return;showPhoto(URL.createObjectURL(selected),current?.name);document.getElementById("saveButton").disabled=false;document.getElementById("status").textContent=`선택됨: ${selected.name}`};
async function savePhoto(){if(!selected)return;const button=document.getElementById("saveButton"),status=document.getElementById("status");button.disabled=true;try{const image=await OurcomFiles.uploadFile(selected,percent=>status.textContent=`업로드 중 ${percent}%`);const response=await fetch("/api/profile",{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({profileImage:image})});const data=await response.json();if(!data.success)throw Error(data.message);selected=null;status.textContent="프로필 사진을 저장했습니다.";await load()}catch(error){status.textContent=error.message||"저장하지 못했습니다."}finally{button.disabled=!selected}}
async function removePhoto(){if(!confirm("프로필 사진을 기본 사진으로 바꿀까요?"))return;const response=await fetch("/api/profile",{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({profileImage:null})});const data=await response.json();document.getElementById("status").textContent=data.success?"기본 사진으로 변경했습니다.":data.message;selected=null;await load()}
load();
</script></body></html>
