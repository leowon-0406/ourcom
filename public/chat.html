<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>OURCOM 채팅</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;

    font-family:
        Arial,
        "Noto Sans KR",
        sans-serif;

    background: #f5f6f8;
}

.header {

    height: 65px;

    background: #111827;

    color: white;

    display: flex;

    align-items: center;

    padding: 0 20px;

    font-size: 20px;

    font-weight: bold;

}

.back {

    margin-left: auto;

    background: #374151;

    color: white;

    border: none;

    border-radius: 8px;

    padding: 8px 12px;

    cursor: pointer;

}

.chat {

    height:
        calc(100vh - 65px);

    display: flex;

    flex-direction: column;

}

.messages {

    flex: 1;

    overflow-y: auto;

    padding: 20px;

}

.message {

    margin-bottom: 18px;

}

.name {

    font-size: 13px;

    font-weight: bold;

    margin-bottom: 5px;

}

.mine {

    text-align: right;
}

.mine .name {
    color: #4f46e5;
}

.bubble {

    display: inline-block;

    max-width: 70%;

    padding: 10px 14px;

    border-radius: 14px;

    background: white;

    box-shadow:
        0 2px 5px
        rgba(0,0,0,0.05);

    word-break: break-word;

}

.mine .bubble {

    background: #111827;

    color: white;

}

.time {

    display: inline-block;

    margin-left: 7px;

    font-size: 11px;

    color: #999;

}

.read-count {

    display: inline-block;

    margin-left: 6px;

    color: #999;

    font-size: 11px;

    cursor: pointer;

    font-weight: bold;

}

.read-count:hover {

    text-decoration: underline;

}

.reply-button {
    margin-left: 7px; padding: 3px 7px; border: 1px solid #d1d5db;
    border-radius: 8px; background: white; color: #4b5563;
    font-size: 11px; cursor: pointer;
}

.reply-reference {
    display: block; width: 100%; margin-bottom: 7px; padding: 7px 9px;
    border: none; border-left: 3px solid #818cf8; border-radius: 6px;
    background: rgba(99, 102, 241, .10); color: inherit;
    text-align: left; cursor: pointer;
}

.reply-reference strong, .reply-reference span { display: block; }
.reply-reference span { opacity: .75; font-size: 12px; }

.reply-preview {
    display: none; align-items: center; justify-content: space-between;
    padding: 9px 15px; border-top: 1px solid #ddd;
    background: #f5f3ff; font-size: 13px;
}

.reply-preview strong, .reply-preview span { display: block; }
.reply-preview span { color: #6b7280; }
.reply-preview button { border: 0; background: transparent; font-size: 22px; cursor: pointer; }
.reply-highlight { animation: replyFlash 1.4s ease; }
@keyframes replyFlash { 50% { background: #fef3c7; } }

.input-area {

    display: flex;

    padding: 15px;

    background: white;

    border-top:
        1px solid #ddd;

}

#messageInput {

    flex: 1;

    padding: 13px;

    border:
        1px solid #ddd;

    border-radius: 12px;

    font-size: 15px;

    outline: none;

}

#sendButton {

    margin-left: 10px;

    padding: 0 20px;

    border: none;

    border-radius: 12px;

    background: #111827;

    color: white;

    cursor: pointer;

}

.modal {

    display: none;

    position: fixed;

    inset: 0;

    background:
        rgba(0,0,0,0.4);

    align-items: center;

    justify-content: center;

    z-index: 100;

}

.modal-box {

    width: min(90%, 350px);

    background: white;

    border-radius: 18px;

    padding: 25px;

    box-shadow:
        0 10px 40px
        rgba(0,0,0,0.25);

}

.modal-box h3 {

    margin-top: 0;

}

.user-row {

    padding: 9px 0;

    border-bottom:
        1px solid #eee;

}

.close-button {

    width: 100%;

    margin-top: 15px;

    padding: 11px;

    border: none;

    border-radius: 10px;

    background: #111827;

    color: white;

    cursor: pointer;

}

</style>

</head>


<body>


<div class="header">

💬 OURCOM 전체 채팅

<button
    class="back"
    onclick="location.href='/main.html'"
>
    ← 홈
</button>

</div>


<div class="chat">

    <div
        id="messages"
        class="messages"
    ></div>

    <div id="replyPreview" class="reply-preview">
        <div>
            <strong id="replyPreviewName"></strong>
            <span id="replyPreviewText"></span>
        </div>
        <button type="button" onclick="cancelReply()" aria-label="답장 취소">×</button>
    </div>

    <div class="input-area">

        <input
            id="messageInput"
            type="text"
            placeholder="메시지를 입력하세요..."
            autocomplete="off"
        >

        <button id="sendButton">
            전송
        </button>

    </div>

</div>


<!-- =================================
     읽지 않은 사람
================================= -->

<div
    id="readModal"
    class="modal"
>

    <div class="modal-box">

        <h3>
            👀 읽지 않은 사람
        </h3>

        <div id="readUsers">
            불러오는 중...
        </div>

        <button
            class="close-button"
            onclick="closeReadModal()"
        >
            닫기
        </button>

    </div>

</div>


<script src="/socket.io/socket.io.js"></script>


<script>

let currentUser = null;

let socket = null;

let replyingTo = null;

function startReply(message) {
    replyingTo = { id: message.id, name: message.name, text: message.text };
    document.getElementById("replyPreviewName").textContent = `${replyingTo.name}님에게 답장`;
    document.getElementById("replyPreviewText").textContent = replyingTo.text;
    document.getElementById("replyPreview").style.display = "flex";
    document.getElementById("messageInput").focus();
}

function cancelReply() {
    replyingTo = null;
    document.getElementById("replyPreview").style.display = "none";
}

function scrollToMessage(messageId) {
    const target = document.querySelector(`[data-message-id="${Number(messageId)}"]`);
    if (!target) return;
    target.scrollIntoView({ behavior: "smooth", block: "center" });
    target.classList.remove("reply-highlight");
    void target.offsetWidth;
    target.classList.add("reply-highlight");
    setTimeout(() => target.classList.remove("reply-highlight"), 1400);
}

function appendReplyReference(bubble, message) {
    if (!message.replyToId) return;
    const reference = document.createElement("button");
    reference.type = "button";
    reference.className = "reply-reference";
    const name = document.createElement("strong");
    name.textContent = message.replyToName || "원문";
    const text = document.createElement("span");
    text.textContent = message.replyToText || "삭제된 메시지";
    reference.append(name, text);
    reference.onclick = () => scrollToMessage(message.replyToId);
    bubble.appendChild(reference);
}


/* =====================================
   로그인 확인
===================================== */

async function checkLogin() {

    const response =
        await fetch("/api/me");

    const data =
        await response.json();


    if (!data.loggedIn) {

        location.href = "/";

        return false;

    }


    currentUser =
        data.user;

    return true;

}


/* =====================================
   메시지 HTML 만들기
===================================== */

function createMessageElement(
    message
) {

    const wrapper =
        document.createElement("div");

    wrapper.className =
        "message";

    wrapper.dataset.messageId =
        message.id;


    if (
        message.userId ===
        currentUser.id
    ) {

        wrapper.classList.add(
            "mine"
        );

    }


    const name =
        document.createElement("div");

    name.className =
        "name";

    name.textContent =
        message.name;


    const bubble =
        document.createElement("span");

    bubble.className =
        "bubble";

    appendReplyReference(bubble, message);

    const messageText = document.createElement("span");
    messageText.textContent = message.text;
    bubble.appendChild(messageText);


    const time =
        document.createElement("span");

    time.className =
        "time";

    time.textContent =
        message.time;


    wrapper.appendChild(name);

    wrapper.appendChild(bubble);

    wrapper.appendChild(time);


    /* =================================
       읽음 숫자
    ================================= */

    const count =
        document.createElement("span");

    count.className =
        "read-count";

    count.style.display =
        "none";


    count.onclick =
        () => {

            showUnreadUsers(
                message.id
            );

        };


    wrapper.appendChild(count);

    const replyButton = document.createElement("button");
    replyButton.type = "button";
    replyButton.className = "reply-button";
    replyButton.textContent = "↩ 답장";
    replyButton.onclick = () => startReply(message);
    wrapper.appendChild(replyButton);


    return wrapper;

}


/* =====================================
   메시지 추가
===================================== */

function addMessage(message) {

    const container =
        document.getElementById(
            "messages"
        );


    const element =
        createMessageElement(
            message
        );


    container.appendChild(element);


    container.scrollTop =
        container.scrollHeight;

}


/* =====================================
   읽음 숫자 갱신
===================================== */

async function updateReadCounts() {

    const response =
        await fetch(
            "/api/group-unread-counts"
        );

    const data =
        await response.json();


    if (!data.success) {
        return;
    }


    document
        .querySelectorAll(".message")
        .forEach(element => {

            const id =
                Number(
                    element.dataset.messageId
                );

            const count =
                data.counts[id] ?? 0;

            const countElement =
                element.querySelector(
                    ".read-count"
                );


            /*
             * 현재 로그인한 사람은
             * 자기 메시지를 읽을 필요가 없으므로
             * 숫자 계산에서 제외하도록 서버를
             * 수정하지 않고 여기서 보정한다.
             */

            if (
                count > 0
            ) {

                countElement.textContent =
                    count;

                countElement.style.display =
                    "inline-block";

            }
            else {

                countElement.style.display =
                    "none";

            }

        });

}


/* =====================================
   안 읽은 사람 보기
===================================== */

async function showUnreadUsers(
    messageId
) {

    const response =
        await fetch(
            `/api/group-message/${messageId}/unread-users`
        );

    const data =
        await response.json();


    const container =
        document.getElementById(
            "readUsers"
        );


    if (
        !data.success ||
        data.users.length === 0
    ) {

        container.innerHTML =
            `
            <div class="user-row">
                🟢 모두 읽었습니다!
            </div>
            `;

    }
    else {

        container.innerHTML =
            data.users
                .map(
                    user =>
                        `
                        <div class="user-row">
                            🔴 ${escapeHtml(
                                user.name
                            )}
                        </div>
                        `
                )
                .join("");

    }


    document.getElementById(
        "readModal"
    ).style.display =
        "flex";

}


/* =====================================
   모달 닫기
===================================== */

function closeReadModal() {

    document.getElementById(
        "readModal"
    ).style.display =
        "none";

}


/* =====================================
   HTML 문자 보호
===================================== */

function escapeHtml(text) {

    const div =
        document.createElement(
            "div"
        );

    div.textContent =
        text;

    return div.innerHTML;

}


/* =====================================
   현재 화면의 메시지를 읽음 처리
===================================== */

async function markMessagesRead() {

    if (!socket) {
        return;
    }


    const response =
        await fetch(
            "/api/group-messages"
        );

    const data =
        await response.json();


    if (!data.success) {
        return;
    }


    const ids =
        data.messages
            .filter(
                message =>
                    message.userId !==
                    currentUser.id
            )
            .map(
                message =>
                    message.id
            );


    if (ids.length > 0) {

        socket.emit(
            "mark messages read",
            ids
        );

    }

}


/* =====================================
   채팅 시작
===================================== */

async function startChat() {

    const loggedIn =
        await checkLogin();

    if (!loggedIn) {
        return;
    }


    socket = io();


    socket.emit(
        "join group"
    );


    /* ================================
       기존 메시지
    ================================= */

    socket.on(
        "group history",
        history => {

            const container =
                document.getElementById(
                    "messages"
                );

            container.innerHTML =
                "";


            history.forEach(
                addMessage
            );


            updateReadCounts();

        }
    );


    /* ================================
       새 메시지
    ================================= */

    socket.on(
        "group message",
        message => {

            addMessage(message);

            updateReadCounts();

            if (message.userId !== currentUser.id) {
                markMessagesRead();
            }

        }
    );


    /* ================================
       읽음 상태 변화
    ================================= */

    socket.on(
        "read-status-update",
        () => {

            updateReadCounts();

        }
    );


    /* ================================
       전송
    ================================= */

    function sendMessage() {

        const input =
            document.getElementById(
                "messageInput"
            );


        const text =
            input.value.trim();


        if (!text) {
            return;
        }


        socket.emit(
            "group message",
            {
                text,
                replyToId: replyingTo ? replyingTo.id : null
            }
        );


        input.value = "";

        cancelReply();

        input.focus();

    }


    document
        .getElementById("sendButton")
        .addEventListener(
            "click",
            sendMessage
        );


    document
        .getElementById("messageInput")
        .addEventListener(
            "keydown",
            event => {

                if (
                    event.key === "Enter"
                ) {

                    sendMessage();

                }

            }
        );


    /*
     * 채팅방에 들어왔으므로
     * 상대방 메시지를 읽음 처리
     */

    setTimeout(
        markMessagesRead,
        500
    );

}


/* =====================================
   시작
===================================== */

startChat();

</script>

</body>

</html>
