<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>OURCOM 단체 채팅</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;

    font-family:
        Arial,
        "Noto Sans KR",
        sans-serif;

    background: #f5f6f8;
}

.header {
    height: 70px;

    background: #111827;

    color: white;

    display: flex;

    align-items: center;

    padding: 0 20px;
}

.room-info {
    display: flex;

    flex-direction: column;
}

.title {
    font-size: 18px;

    font-weight: bold;
}

.subtitle {
    margin-top: 3px;

    color: #9ca3af;

    font-size: 12px;
}

.buttons {
    margin-left: auto;

    display: flex;

    gap: 7px;
}

.header-button {
    border: none;

    border-radius: 9px;

    padding: 9px 12px;

    background: #374151;

    color: white;

    cursor: pointer;
}

.chat {
    height:
        calc(100vh - 70px);

    display: flex;

    flex-direction: column;
}

.messages {
    flex: 1;

    overflow-y: auto;

    padding: 20px;
}

.message {
    margin-bottom: 15px;
}

.message.mine {
    text-align: right;
}

.sender {
    margin-bottom: 4px;

    font-size: 12px;

    color: #777;
}

.mine .sender {
    display: none;
}

.bubble {
    display: inline-block;

    max-width: 70%;

    padding: 11px 14px;

    border-radius: 15px;

    background: white;

    box-shadow:
        0 2px 5px
        rgba(0,0,0,0.05);

    word-break: break-word;
}

.mine .bubble {
    background: #111827;

    color: white;
}

.time {
    margin-left: 7px;

    font-size: 11px;

    color: #999;
}

.reply-button {
    margin-left: 7px; padding: 3px 7px; border: 1px solid #d1d5db;
    border-radius: 8px; background: white; color: #4b5563;
    font-size: 11px; cursor: pointer;
}

.unread-count {
    display: none; margin-left: 7px; color: #ef4444;
    font-size: 12px; font-weight: bold; cursor: pointer;
}

.modal {
    display: none; position: fixed; inset: 0; align-items: center;
    justify-content: center; padding: 20px; background: rgba(0, 0, 0, .42);
    z-index: 1000;
}
.modal-box { width: min(360px, 100%); padding: 22px; border-radius: 16px; background: white; }
.modal-user { padding: 8px 0; border-bottom: 1px solid #eee; }
.modal-close { width: 100%; margin-top: 16px; padding: 10px; border: 0; border-radius: 10px; cursor: pointer; }

.reply-reference {
    display: block; width: 100%; margin-bottom: 7px; padding: 7px 9px;
    border: none; border-left: 3px solid #818cf8; border-radius: 6px;
    background: rgba(99, 102, 241, .10); color: inherit;
    text-align: left; cursor: pointer;
}

.reply-reference strong, .reply-reference span { display: block; }
.reply-reference span { opacity: .75; font-size: 12px; }
.reply-preview {
    display: none; align-items: center; justify-content: space-between;
    padding: 9px 15px; border-top: 1px solid #ddd;
    background: #f5f3ff; font-size: 13px;
}
.reply-preview strong, .reply-preview span { display: block; }
.reply-preview span { color: #6b7280; }
.reply-preview button { border: 0; background: transparent; font-size: 22px; cursor: pointer; }
.reply-highlight { animation: replyFlash 1.4s ease; }
@keyframes replyFlash { 50% { background: #fef3c7; } }

.input-area {
    display: flex;

    padding: 15px;

    background: white;

    border-top:
        1px solid #ddd;
}

#messageInput {
    flex: 1;

    padding: 13px;

    border:
        1px solid #ddd;

    border-radius: 12px;

    font-size: 15px;

    outline: none;
}

#sendButton {
    margin-left: 10px;

    padding: 0 20px;

    border: none;

    border-radius: 12px;

    background: #111827;

    color: white;

    cursor: pointer;
}

.empty {
    text-align: center;

    color: #aaa;

    margin-top: 30px;
}

</style>

</head>


<body>


<div class="header">

    <div class="room-info">

        <div
            id="roomName"
            class="title"
        >
            불러오는 중...
        </div>

        <div
            id="memberCount"
            class="subtitle"
        >
            -
        </div>

    </div>


    <div class="buttons">

        <button
            class="header-button"
            onclick="showMembers()"
        >
            👥
        </button>

        <button
            class="header-button"
            onclick="leaveRoom()"
        >
            나가기
        </button>

    </div>

</div>


<div class="chat">

    <div
        id="messages"
        class="messages"
    ></div>

    <div id="replyPreview" class="reply-preview">
        <div>
            <strong id="replyPreviewName"></strong>
            <span id="replyPreviewText"></span>
        </div>
        <button type="button" onclick="cancelReply()" aria-label="답장 취소">×</button>
    </div>

    <div class="input-area">

        <input
            id="messageInput"
            type="text"
            placeholder="메시지를 입력하세요..."
            autocomplete="off"
        >

        <button
            id="sendButton"
        >
            전송
        </button>

    </div>

</div>

<div id="unreadModal" class="modal" onclick="closeUnreadModal(event)">
    <div class="modal-box">
        <h3>안 읽은 사람</h3>
        <div id="unreadUsers"></div>
        <button class="modal-close" type="button" onclick="closeUnreadModal()">닫기</button>
    </div>
</div>


<script src="/socket.io/socket.io.js"></script>


<script>

let socket = null;

let currentUser = null;

let roomId = null;

let roomMembers = [];

let replyingTo = null;

function startReply(message) {
    replyingTo = { id: message.id, name: message.userName, text: message.text };
    document.getElementById("replyPreviewName").textContent = `${replyingTo.name}님에게 답장`;
    document.getElementById("replyPreviewText").textContent = replyingTo.text;
    document.getElementById("replyPreview").style.display = "flex";
    document.getElementById("messageInput").focus();
}

function cancelReply() {
    replyingTo = null;
    document.getElementById("replyPreview").style.display = "none";
}

function scrollToMessage(messageId) {
    const target = document.querySelector(`[data-message-id="${Number(messageId)}"]`);
    if (!target) return;
    target.scrollIntoView({ behavior: "smooth", block: "center" });
    target.classList.remove("reply-highlight");
    void target.offsetWidth;
    target.classList.add("reply-highlight");
    setTimeout(() => target.classList.remove("reply-highlight"), 1400);
}

function appendReplyReference(bubble, message) {
    if (!message.replyToId) return;
    const reference = document.createElement("button");
    reference.type = "button";
    reference.className = "reply-reference";
    const name = document.createElement("strong");
    name.textContent = message.replyToName || "원문";
    const text = document.createElement("span");
    text.textContent = message.replyToText || "삭제된 메시지";
    reference.append(name, text);
    reference.onclick = () => scrollToMessage(message.replyToId);
    bubble.appendChild(reference);
}


/* =================================
   방 번호
================================= */

const params =
    new URLSearchParams(
        window.location.search
    );

roomId =
    Number(
        params.get("id")
    );


if (!roomId) {

    location.href =
        "/group-create.html";

}


/* =================================
   로그인
================================= */

async function checkLogin() {

    const response =
        await fetch("/api/me");

    const data =
        await response.json();


    if (!data.loggedIn) {

        location.href = "/";

        return false;

    }


    currentUser =
        data.user;

    return true;

}


/* =================================
   방 정보
================================= */

async function loadRoom() {

    const response =
        await fetch(
            `/api/chat-rooms/${roomId}`
        );


    const data =
        await response.json();


    if (!data.success) {

        alert(
            data.message ||
            "채팅방을 불러올 수 없습니다."
        );

        location.href =
            "/group-create.html";

        return false;

    }


    document.getElementById(
        "roomName"
    ).textContent =
        data.room.name;


    roomMembers =
        data.members;


    document.getElementById(
        "memberCount"
    ).textContent =
        `${roomMembers.length}명 참여`;


    return true;

}


/* =================================
   메시지 출력
================================= */

function addMessage(message) {

    const container =
        document.getElementById(
            "messages"
        );


    const empty =
        document.querySelector(
            ".empty"
        );


    if (empty) {
        empty.remove();
    }


    const div =
        document.createElement(
            "div"
        );


    div.className =
        "message";

    div.dataset.messageId =
        message.id;


    if (
        message.userId ===
        currentUser.id
    ) {

        div.classList.add(
            "mine"
        );

    }


    const sender =
        document.createElement(
            "div"
        );

    sender.className =
        "sender";

    sender.textContent =
        message.userName;


    const bubble =
        document.createElement(
            "span"
        );

    bubble.className =
        "bubble";

    appendReplyReference(bubble, message);

    const messageText = document.createElement("span");
    messageText.textContent = message.text;
    bubble.appendChild(messageText);


    const time =
        document.createElement(
            "span"
        );

    time.className =
        "time";

    time.textContent =
        message.time;


    div.appendChild(
        sender
    );

    div.appendChild(
        bubble
    );

    div.appendChild(
        time
    );

    const unreadCount = document.createElement("span");
    unreadCount.className = "unread-count";
    unreadCount.onclick = () => showUnreadUsers(message.id);
    div.appendChild(unreadCount);

    const replyButton = document.createElement("button");
    replyButton.type = "button";
    replyButton.className = "reply-button";
    replyButton.textContent = "↩ 답장";
    replyButton.onclick = () => startReply(message);
    div.appendChild(replyButton);


    container.appendChild(
        div
    );


    container.scrollTop =
        container.scrollHeight;

}

async function updateRoomReadCounts() {
    const response = await fetch(`/api/chat-rooms/${roomId}/unread-counts`);
    const data = await response.json();
    if (!data.success) return;
    document.querySelectorAll(".message").forEach(element => {
        const count = data.counts[Number(element.dataset.messageId)] || 0;
        const countElement = element.querySelector(".unread-count");
        countElement.textContent = count;
        countElement.style.display = count > 0 ? "inline-block" : "none";
    });
}

async function markRoomMessagesRead(messages) {
    const ids = (Array.isArray(messages) ? messages : [])
        .filter(message => message.userId !== currentUser.id)
        .map(message => message.id);
    if (!ids.length) return;
    await fetch(`/api/chat-rooms/${roomId}/read`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messageIds: ids })
    });
    await updateRoomReadCounts();
}

async function showUnreadUsers(messageId) {
    const response = await fetch(`/api/chat-rooms/${roomId}/message/${messageId}/unread-users`);
    const data = await response.json();
    const container = document.getElementById("unreadUsers");
    container.innerHTML = "";
    if (!data.success || data.users.length === 0) {
        container.textContent = "모두 읽었습니다.";
    } else {
        data.users.forEach(user => {
            const row = document.createElement("div");
            row.className = "modal-user";
            row.textContent = `🔴 ${user.name} (@${user.id})`;
            container.appendChild(row);
        });
    }
    document.getElementById("unreadModal").style.display = "flex";
}

function closeUnreadModal(event) {
    if (event && event.target !== event.currentTarget) return;
    document.getElementById("unreadModal").style.display = "none";
}


/* =================================
   채팅 시작
================================= */

async function startChat() {

    const loggedIn =
        await checkLogin();


    if (!loggedIn) {
        return;
    }


    const roomLoaded =
        await loadRoom();


    if (!roomLoaded) {
        return;
    }


    socket =
        io();


    socket.emit(
        "join chat room",
        roomId
    );


    socket.on(
        "chat room history",
        data => {

            const container =
                document.getElementById(
                    "messages"
                );


            container.innerHTML = "";


            if (
                !data.messages ||
                data.messages.length === 0
            ) {

                container.innerHTML = `
                    <div class="empty">
                        아직 대화가 없습니다.<br>
                        첫 메시지를 보내보세요!
                    </div>
                `;

                return;

            }


            data.messages.forEach(
                addMessage
            );

            updateRoomReadCounts();
            markRoomMessagesRead(data.messages);

        }
    );


    socket.on(
        "chat room message",
        message => {

            if (
                Number(message.roomId) !==
                Number(roomId)
            ) {
                return;
            }


            addMessage(
                message
            );

            updateRoomReadCounts();

            if (message.userId !== currentUser.id) {
                markRoomMessagesRead([message]);
            }

        }
    );

    socket.on(
        "chat-room-read-update",
        updateRoomReadCounts
    );


    socket.on(
        "chat room error",
        message => {

            alert(message);

            location.href =
                "/group-create.html";

        }
    );


    document
        .getElementById(
            "sendButton"
        )
        .addEventListener(
            "click",
            sendMessage
        );


    document
        .getElementById(
            "messageInput"
        )
        .addEventListener(
            "keydown",
            event => {

                if (
                    event.key === "Enter"
                ) {

                    sendMessage();

                }

            }
        );

}


/* =================================
   메시지 전송
================================= */

function sendMessage() {

    const input =
        document.getElementById(
            "messageInput"
        );


    const text =
        input.value.trim();


    if (!text) {
        return;
    }


    socket.emit(
        "chat room message",
        {
            roomId,
            text,
            replyToId: replyingTo ? replyingTo.id : null
        }
    );


    input.value = "";

    cancelReply();

    input.focus();

}


/* =================================
   멤버 보기
================================= */

function showMembers() {

    if (
        roomMembers.length === 0
    ) {
        return;
    }


    const names =
        roomMembers
            .map(
                member =>
                    `• ${member.name} (@${member.id})`
            )
            .join("\n");


    alert(
        `채팅방 멤버\n\n${names}`
    );

}


/* =================================
   채팅방 나가기
================================= */

async function leaveRoom() {

    const yes =
        confirm(
            "정말 이 채팅방에서 나갈까요?"
        );


    if (!yes) {
        return;
    }


    try {

        const response =
            await fetch(
                `/api/chat-rooms/${roomId}/leave`,
                {
                    method: "DELETE"
                }
            );


        const data =
            await response.json();


        if (!data.success) {

            alert(
                data.message ||
                "채팅방에서 나갈 수 없습니다."
            );

            return;

        }


        if (socket) {
            socket.disconnect();
        }


        location.href =
            "/group-create.html";

    }

    catch (error) {

        console.error(error);

        alert(
            "오류가 발생했습니다."
        );

    }

}


startChat();

</script>

</body>

</html>
