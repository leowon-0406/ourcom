<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">
<meta name="theme-color" content="#111827">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/ourcom-192.png">
<script defer src="/pwa.js"></script>

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>OURCOM 단체 채팅</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;

    font-family:
        Arial,
        "Noto Sans KR",
        sans-serif;

    background: #f5f6f8;
}

.header {
    height: 70px;

    background: #111827;

    color: white;

    display: flex;

    align-items: center;

    padding: 0 20px;
}

.room-info {
    display: flex;

    flex-direction: column;
}

.title {
    font-size: 18px;

    font-weight: bold;
}

.subtitle {
    margin-top: 3px;

    color: #9ca3af;

    font-size: 12px;
}

.buttons {
    margin-left: auto;

    display: flex;

    gap: 7px;
}

.header-button {
    border: none;

    border-radius: 9px;

    padding: 9px 12px;

    background: #374151;

    color: white;

    cursor: pointer;
}

.chat {
    height:
        calc(100vh - 70px);

    display: flex;

    flex-direction: column;
}

.messages {
    flex: 1;

    overflow-y: auto;

    padding: 20px;
}

.message {
    margin-bottom: 15px;
}

.message.pending { opacity: .62; }
.message.failed .time { color: #ef4444; font-weight: bold; }
.retry-button { margin-left: 6px; border: 0; border-radius: 7px; padding: 4px 7px; color: white; background: #ef4444; cursor: pointer; }
.message-action { margin-left: 5px; padding: 3px 6px; border: 1px solid #d1d5db; border-radius: 7px; background: white; color: #4b5563; font-size: 11px; cursor: pointer; }
.edited-label { margin-left: 5px; color: #9ca3af; font-size: 10px; }
.message.deleted .message-text { color: #9ca3af; font-style: italic; }
.connection-status { display: none; padding: 7px; background: #fef3c7; color: #92400e; text-align: center; font-size: 13px; }

.message.mine {
    text-align: right;
}

.sender {
    margin-bottom: 4px;

    font-size: 12px;

    color: #777;
}

.mine .sender {
    display: none;
}

.bubble {
    display: inline-block;

    max-width: 70%;

    padding: 11px 14px;

    border-radius: 15px;

    background: white;

    box-shadow:
        0 2px 5px
        rgba(0,0,0,0.05);

    word-break: break-word;
}

.mine .bubble {
    background: #111827;

    color: white;
}

.time {
    margin-left: 7px;

    font-size: 11px;

    color: #999;
}

.reply-button {
    margin-left: 7px; padding: 3px 7px; border: 1px solid #d1d5db;
    border-radius: 8px; background: white; color: #4b5563;
    font-size: 11px; cursor: pointer;
}

.unread-count {
    display: none; margin-left: 7px; color: #ef4444;
    font-size: 12px; font-weight: bold; cursor: pointer;
}

.modal {
    display: none; position: fixed; inset: 0; align-items: center;
    justify-content: center; padding: 20px; background: rgba(0, 0, 0, .42);
    z-index: 1000;
}
.modal-box { width: min(360px, 100%); padding: 22px; border-radius: 16px; background: white; }
.modal-user { padding: 8px 0; border-bottom: 1px solid #eee; }
.modal-close { width: 100%; margin-top: 16px; padding: 10px; border: 0; border-radius: 10px; cursor: pointer; }

.room-manage-box { width: min(520px, 100%); max-height: min(720px, 90vh); overflow-y: auto; }
.manage-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.manage-header h3 { margin: 0; }
.manage-x { border: 0; background: transparent; color: #6b7280; font-size: 24px; cursor: pointer; }
.manage-section { margin-top: 20px; }
.manage-label { margin-bottom: 8px; color: #374151; font-size: 13px; font-weight: bold; }
.manage-form { display: flex; gap: 8px; }
.manage-form input, .manage-form select { min-width: 0; flex: 1; padding: 10px; border: 1px solid #d1d5db; border-radius: 9px; background: white; }
.manage-form button, .member-action { border: 0; border-radius: 9px; padding: 9px 11px; background: #111827; color: white; cursor: pointer; }
.member-list { border-top: 1px solid #e5e7eb; }
.member-row { display: flex; align-items: center; gap: 8px; padding: 12px 0; border-bottom: 1px solid #e5e7eb; }
.member-identity { min-width: 0; flex: 1; }
.member-name { font-weight: bold; }
.member-id { margin-top: 2px; color: #6b7280; font-size: 12px; }
.owner-badge { display: inline-block; margin-left: 6px; padding: 2px 6px; border-radius: 999px; background: #e0e7ff; color: #3730a3; font-size: 10px; }
.member-actions { display: flex; gap: 5px; }
.member-action { padding: 7px 9px; font-size: 11px; }
.member-action.danger { background: #dc2626; }
.manage-note { color: #6b7280; font-size: 12px; }

@media (max-width: 650px) {
    .header { height: 58px; padding: 0 10px; }
    .chat { height: calc(100vh - 58px); }
    .title { max-width: 145px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 15px; }
    .header-button { padding: 7px 9px; font-size: 12px; }
    .messages { padding: 13px 10px; }
    .input-area { padding: 9px; }
    .manage-form { flex-wrap: wrap; }
    .manage-form button { width: 100%; }
    .member-row { align-items: flex-start; }
    .member-actions { flex-direction: column; }
}

.reply-reference {
    display: block; width: 100%; margin-bottom: 7px; padding: 7px 9px;
    border: none; border-left: 3px solid #818cf8; border-radius: 6px;
    background: rgba(99, 102, 241, .10); color: inherit;
    text-align: left; cursor: pointer;
}

.reply-reference strong, .reply-reference span { display: block; }
.reply-reference span { opacity: .75; font-size: 12px; }
.reply-preview {
    display: none; align-items: center; justify-content: space-between;
    padding: 9px 15px; border-top: 1px solid #ddd;
    background: #f5f3ff; font-size: 13px;
}
.reply-preview strong, .reply-preview span { display: block; }
.reply-preview span { color: #6b7280; }
.reply-preview button { border: 0; background: transparent; font-size: 22px; cursor: pointer; }
.reply-highlight { animation: replyFlash 1.4s ease; }
@keyframes replyFlash { 50% { background: #fef3c7; } }

.input-area {
    display: flex;

    padding: 15px;

    background: white;

    border-top:
        1px solid #ddd;
}

#messageInput {
    flex: 1;

    padding: 13px;

    border:
        1px solid #ddd;

    border-radius: 12px;

    font-size: 15px;

    outline: none;
}

#sendButton {
    margin-left: 10px;

    padding: 0 20px;

    border: none;

    border-radius: 12px;

    background: #111827;

    color: white;

    cursor: pointer;
}

.empty {
    text-align: center;

    color: #aaa;

    margin-top: 30px;
}

</style>

</head>


<body>


<div class="header">

    <div class="room-info">

        <div
            id="roomName"
            class="title"
        >
            불러오는 중...
        </div>

        <div
            id="memberCount"
            class="subtitle"
        >
            -
        </div>

    </div>


    <div class="buttons">

        <button
            class="header-button"
            onclick="showMembers()"
        >
            관리
        </button>

        <button
            class="header-button"
            onclick="leaveRoom()"
        >
            나가기
        </button>

    </div>

</div>


<div class="chat">

    <div id="connectionStatus" class="connection-status">서버에 다시 연결하는 중...</div>

    <div
        id="messages"
        class="messages"
    ></div>

    <div id="replyPreview" class="reply-preview">
        <div>
            <strong id="replyPreviewName"></strong>
            <span id="replyPreviewText"></span>
        </div>
        <button type="button" onclick="cancelReply()" aria-label="답장 취소">×</button>
    </div>

    <div class="input-area">

        <input
            id="messageInput"
            type="text"
            placeholder="메시지를 입력하세요..."
            autocomplete="off"
        >

        <button
            id="sendButton"
        >
            전송
        </button>

    </div>

</div>

<div id="unreadModal" class="modal" onclick="closeUnreadModal(event)">
    <div class="modal-box">
        <h3>안 읽은 사람</h3>
        <div id="unreadUsers"></div>
        <button class="modal-close" type="button" onclick="closeUnreadModal()">닫기</button>
    </div>
</div>

<div id="roomManageModal" class="modal" onclick="closeRoomManager(event)">
    <div class="modal-box room-manage-box">
        <div class="manage-header">
            <h3>단체방 관리</h3>
            <button class="manage-x" type="button" onclick="closeRoomManager()" aria-label="닫기">×</button>
        </div>
        <div id="ownerRoomControls"></div>
        <div class="manage-section">
            <div class="manage-label">참여 멤버</div>
            <div id="roomMemberList" class="member-list"></div>
        </div>
    </div>
</div>


<script src="/socket.io/socket.io.js"></script>
<script src="/chat-attachments.js"></script>
<script src="/chat-tools.js"></script>
<script src="/chat-typing.js"></script>


<script>

let socket = null;

let currentUser = null;

let roomId = null;

let roomMembers = [];

let currentRoom = null;
let displayNames = {};

let replyingTo = null;

let readCountTimer = null;
let hasMoreMessages = true;
let loadingOlder = false;
const pendingMessages = new Map();
OurcomFiles.init();

function scheduleReadCountUpdate() {
    clearTimeout(readCountTimer);
    readCountTimer = setTimeout(updateRoomReadCounts, 120);
}

function watchPendingMessage(clientId) {
    setTimeout(() => {
        const target = Array.from(document.querySelectorAll(".message[data-client-id]"))
            .find(element => element.dataset.clientId === clientId);
        if (!target) return;
        target.classList.remove("pending");
        target.classList.add("failed");
        const time = target.querySelector(".time");
        if (time) time.textContent = "전송 지연";
        if (!target.querySelector(".retry-button")) {
            const retry = document.createElement("button");
            retry.className = "retry-button";
            retry.textContent = "다시 보내기";
            retry.onclick = () => retryPendingMessage(clientId);
            target.appendChild(retry);
        }
    }, 8000);
}

function retryPendingMessage(clientId) {
    const payload = pendingMessages.get(clientId);
    if (!payload || !socket || !socket.connected) return;
    const target = Array.from(document.querySelectorAll(".message[data-client-id]"))
        .find(element => element.dataset.clientId === clientId);
    if (target) {
        target.classList.remove("failed");
        target.classList.add("pending");
        target.querySelector(".retry-button")?.remove();
        const time = target.querySelector(".time");
        if (time) time.textContent = "다시 전송 중";
    }
    socket.emit("chat room message", payload);
    watchPendingMessage(clientId);
}

function visibleMessageIds() {
    return Array.from(document.querySelectorAll(".message:not(.pending)"))
        .map(element => Number(element.dataset.messageId))
        .filter(Number.isInteger);
}

function startReply(message) {
    replyingTo = { id: message.id, name: displayNames[message.userId] || message.userName, text: OurcomFiles.preview(message) };
    document.getElementById("replyPreviewName").textContent = `${replyingTo.name}님에게 답장`;
    document.getElementById("replyPreviewText").textContent = replyingTo.text;
    document.getElementById("replyPreview").style.display = "flex";
    document.getElementById("messageInput").focus();
}

function cancelReply() {
    replyingTo = null;
    document.getElementById("replyPreview").style.display = "none";
}

function scrollToMessage(messageId) {
    const target = document.querySelector(`[data-message-id="${Number(messageId)}"]`);
    if (!target) return;
    target.scrollIntoView({ behavior: "smooth", block: "center" });
    target.classList.remove("reply-highlight");
    void target.offsetWidth;
    target.classList.add("reply-highlight");
    setTimeout(() => target.classList.remove("reply-highlight"), 1400);
}

function appendReplyReference(bubble, message) {
    if (!message.replyToId) return;
    const reference = document.createElement("button");
    reference.type = "button";
    reference.className = "reply-reference";
    reference.dataset.replyToId = message.replyToId;
    const name = document.createElement("strong");
    name.textContent = message.replyToName || "원문";
    const text = document.createElement("span");
    text.textContent = message.replyToText || "삭제된 메시지";
    reference.append(name, text);
    reference.onclick = () => scrollToMessage(message.replyToId);
    bubble.appendChild(reference);
}


/* =================================
   방 번호
================================= */

const params =
    new URLSearchParams(
        window.location.search
    );

roomId =
    Number(
        params.get("id")
    );


if (!roomId) {

    location.href =
        "/group-create.html";

}

OurcomChatTools.init({
    endpoint: `/api/chat-rooms/${roomId}/messages/search`,
    ensureMessageVisible,
    scrollToMessage
});


/* =================================
   로그인
================================= */

async function checkLogin() {

    const response =
        await fetch("/api/me");

    const data =
        await response.json();


    if (!data.loggedIn) {

        location.href = "/";

        return false;

    }


    currentUser =
        data.user;

    return true;

}


/* =================================
   방 정보
================================= */

async function loadRoom() {

    const response =
        await fetch(
            `/api/chat-rooms/${roomId}`
        );


    const data =
        await response.json();


    if (!data.success) {

        alert(
            data.message ||
            "채팅방을 불러올 수 없습니다."
        );

        location.href =
            "/group-create.html";

        return false;

    }


    document.getElementById(
        "roomName"
    ).textContent =
        data.room.name;

    currentRoom = data.room;


    roomMembers =
        data.members;

    displayNames = Object.fromEntries(roomMembers.map(member => [member.id, member.displayName || member.name]));


    document.getElementById(
        "memberCount"
    ).textContent =
        `${roomMembers.length}명 참여`;


    return true;

}


/* =================================
   메시지 출력
================================= */

function addMessage(message) {

    const container =
        document.getElementById(
            "messages"
        );

    if (Number.isInteger(Number(message.id)) &&
        document.querySelector(`[data-message-id="${Number(message.id)}"]`)) return;


    const empty =
        document.querySelector(
            ".empty"
        );


    if (empty) {
        empty.remove();
    }


    const div =
        document.createElement(
            "div"
        );


    div.className =
        "message";

    div.dataset.messageId =
        message.id;

    if (message.clientId && message.pending) {
        div.dataset.clientId = message.clientId;
    }

    if (message.pending) {
        div.classList.add("pending");
    }


    if (
        message.userId ===
        currentUser.id
    ) {

        div.classList.add(
            "mine"
        );

    }


    const sender =
        document.createElement(
            "div"
        );

    sender.className =
        "sender";

    sender.textContent =
        displayNames[message.userId] || message.userName;


    const bubble =
        document.createElement(
            "span"
        );

    bubble.className =
        "bubble";

    appendReplyReference(bubble, message);

    const messageText = document.createElement("span");
    messageText.className = "message-text";
    messageText.textContent = message.text;
    bubble.appendChild(messageText);
    OurcomFiles.appendToBubble(bubble, message.attachment, message.deleted);

    if (message.edited && !message.deleted) {
        const edited = document.createElement("span");
        edited.className = "edited-label";
        edited.textContent = "(수정됨)";
        bubble.appendChild(edited);
    }

    if (message.deleted) div.classList.add("deleted");


    const time =
        document.createElement(
            "span"
        );

    time.className =
        "time";

    time.textContent =
        message.time;


    div.appendChild(
        sender
    );

    div.appendChild(
        bubble
    );

    div.appendChild(
        time
    );

    const unreadCount = document.createElement("span");
    unreadCount.className = "unread-count";
    unreadCount.onclick = () => showUnreadUsers(message.id);
    div.appendChild(unreadCount);

    const messageActions = document.createElement("span");
    messageActions.className = "message-actions";
    const replyButton = document.createElement("button");
    replyButton.type = "button";
    replyButton.className = "reply-button";
    replyButton.textContent = "↩ 답장";
    replyButton.onclick = () => startReply(message);
    replyButton.disabled = Boolean(message.pending || message.deleted);
    messageActions.appendChild(replyButton);

    if (message.userId === currentUser.id && !message.pending && !message.deleted) {
        const actions = document.createElement("span");
        actions.className = "owner-actions";
        const edit = document.createElement("button");
        edit.className = "message-action";
        edit.textContent = "수정";
        edit.onclick = () => editMessage(message);
        const remove = document.createElement("button");
        remove.className = "message-action";
        remove.textContent = "삭제";
        remove.onclick = () => deleteMessage(message);
        actions.append(edit, remove);
        messageActions.appendChild(actions);
    }

    div.appendChild(messageActions);
    OurcomFiles.enableLongPress(div);


    container.appendChild(
        div
    );


    container.scrollTop =
        container.scrollHeight;

}

function editMessage(message) {
    const element = document.querySelector(`[data-message-id="${Number(message.id)}"]`);
    const current = element?.querySelector(".message-text")?.textContent || message.text;
    const text = prompt("수정할 메시지를 입력하세요.", current);
    if (text === null || !text.trim() || text.trim() === current) return;
    socket.emit("edit chat room message", {
        roomId, messageId: message.id, text: text.trim()
    });
}

function deleteMessage(message) {
    if (!confirm("이 메시지를 삭제할까요?")) return;
    socket.emit("delete chat room message", { roomId, messageId: message.id });
}

function applyMessageUpdate(update) {
    if (Number(update.roomId) !== Number(roomId)) return;
    const element = document.querySelector(`[data-message-id="${Number(update.id)}"]`);
    if (element) {
        const text = element.querySelector(".message-text");
        if (text) text.textContent = update.text;
        element.querySelector(".edited-label")?.remove();
        if (update.edited && !update.deleted) {
            const label = document.createElement("span");
            label.className = "edited-label";
            label.textContent = "(수정됨)";
            element.querySelector(".bubble")?.appendChild(label);
        }
        if (update.deleted) {
            element.classList.add("deleted");
            element.querySelector(".attachment")?.remove();
            element.querySelector(".message-actions")?.remove();
        }
    }
    document.querySelectorAll(`[data-reply-to-id="${Number(update.id)}"] span`)
        .forEach(reference => { reference.textContent = update.text; });
}

function prependMessages(messages) {
    const container = document.getElementById("messages");
    const oldHeight = container.scrollHeight;
    const added = [];
    messages.forEach(message => {
        if (document.querySelector(`[data-message-id="${Number(message.id)}"]`)) return;
        addMessage(message);
        const element = container.lastElementChild;
        if (element) added.push(element);
    });
    added.reverse().forEach(element => container.insertBefore(element, container.firstChild));
    container.scrollTop = container.scrollHeight - oldHeight;
}

async function loadOlderMessages() {
    if (!hasMoreMessages || loadingOlder) return;
    const firstId = visibleMessageIds().sort((a, b) => a - b)[0];
    if (!firstId) return;
    loadingOlder = true;
    try {
        const response = await fetch(`/api/chat-rooms/${roomId}/messages?before=${firstId}`);
        const data = await response.json();
        if (data.success) {
            prependMessages(data.messages);
            hasMoreMessages = data.hasMore;
            markRoomMessagesRead(data.messages);
        }
    } finally {
        loadingOlder = false;
    }
}

async function ensureMessageVisible(messageId) {
    const selector = `[data-message-id="${Number(messageId)}"]`;
    let previousFirst = null;
    for (let attempt = 0; attempt < 100 && !document.querySelector(selector) && hasMoreMessages; attempt += 1) {
        const first = visibleMessageIds().sort((a, b) => a - b)[0];
        if (!first || first === previousFirst) break;
        previousFirst = first;
        await loadOlderMessages();
    }
    return Boolean(document.querySelector(selector));
}

async function updateRoomReadCounts() {
    const ids = visibleMessageIds();
    if (!ids.length) return;
    const response = await fetch(`/api/chat-rooms/${roomId}/unread-counts?ids=${ids.join(",")}`);
    const data = await response.json();
    if (!data.success) return;
    document.querySelectorAll(".message").forEach(element => {
        const count = data.counts[Number(element.dataset.messageId)] || 0;
        const countElement = element.querySelector(".unread-count");
        countElement.textContent = count;
        countElement.style.display = count > 0 ? "inline-block" : "none";
    });
}

async function markRoomMessagesRead(messages) {
    const ids = (Array.isArray(messages) ? messages : [])
        .filter(message => message.userId !== currentUser.id)
        .map(message => message.id);
    if (!ids.length) {
        scheduleReadCountUpdate();
        return;
    }
    await fetch(`/api/chat-rooms/${roomId}/read`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messageIds: ids })
    });
    scheduleReadCountUpdate();
}

async function showUnreadUsers(messageId) {
    const response = await fetch(`/api/chat-rooms/${roomId}/message/${messageId}/unread-users`);
    const data = await response.json();
    const container = document.getElementById("unreadUsers");
    container.innerHTML = "";
    if (!data.success || data.users.length === 0) {
        container.textContent = "모두 읽었습니다.";
    } else {
        data.users.forEach(user => {
            const row = document.createElement("div");
            row.className = "modal-user";
            row.textContent = `${user.name} (@${user.id})`;
            container.appendChild(row);
        });
    }
    document.getElementById("unreadModal").style.display = "flex";
}

function closeUnreadModal(event) {
    if (event && event.target !== event.currentTarget) return;
    document.getElementById("unreadModal").style.display = "none";
}


/* =================================
   채팅 시작
================================= */

async function startChat() {

    const loggedIn =
        await checkLogin();


    if (!loggedIn) {
        return;
    }


    const roomLoaded =
        await loadRoom();


    if (!roomLoaded) {
        return;
    }


    socket =
        io();
    socket.on("account id changed", () => { alert("관리자가 아이디를 변경했습니다. 새 아이디로 다시 접속합니다."); location.reload(); });

    OurcomTyping.init({
        socket,
        input: document.getElementById("messageInput"),
        emitEvent: "chat room typing",
        payload: typing => ({ roomId, typing }),
        listenEvent: "chat room typing",
        accept: data => Number(data.roomId) === Number(roomId) && data.userId !== currentUser.id
    });

    socket.on("connect", () => {
        document.getElementById("connectionStatus").style.display = "none";
        socket.emit("join chat room", roomId);
    });
    socket.on("disconnect", () => {
        document.getElementById("connectionStatus").style.display = "block";
    });
    socket.on("connect_error", () => {
        document.getElementById("connectionStatus").style.display = "block";
    });


    socket.on(
        "chat room history",
        data => {
            hasMoreMessages = Boolean(data.hasMore);

            const container =
                document.getElementById(
                    "messages"
                );


            container.innerHTML = "";


            if (
                !data.messages ||
                data.messages.length === 0
            ) {

                container.innerHTML = `
                    <div class="empty">
                        아직 대화가 없습니다.<br>
                        첫 메시지를 보내보세요!
                    </div>
                `;

                return;

            }


            data.messages.forEach(
                addMessage
            );

            if (data.firstUnreadId) {
                OurcomChatTools.showUnreadMarker(data.firstUnreadId);
            }
            markRoomMessagesRead(data.messages);

        }
    );


    socket.on(
        "chat room message",
        message => {

            if (
                Number(message.roomId) !==
                Number(roomId)
            ) {
                return;
            }


            const pending = Array.from(document.querySelectorAll(".message[data-client-id]"))
                .find(element => element.dataset.clientId === message.clientId);

            if (pending && message.userId === currentUser.id) {
                pending.remove();
                addMessage(message);
                pendingMessages.delete(message.clientId);
            } else {
                addMessage(message);
            }

            if (message.userId !== currentUser.id) {
                markRoomMessagesRead([message]);
            } else {
                scheduleReadCountUpdate();
            }

        }
    );

    socket.on(
        "chat-room-read-update",
        scheduleReadCountUpdate
    );

    socket.on("chat room message updated", applyMessageUpdate);

    socket.on("chat room updated", async data => {
        if (Number(data.roomId) !== Number(roomId)) return;
        if (!await loadRoom()) return;
        if (document.getElementById("roomManageModal").style.display === "flex") {
            await renderRoomManager();
        }
    });

    socket.on("chat room removed", data => {
        if (Number(data.roomId) !== Number(roomId)) return;
        alert("이 단체방에서 내보내졌습니다.");
        location.href = "/group-create.html";
    });


    socket.on(
        "chat room error",
        message => {

            alert(message);

            location.href =
                "/group-create.html";

        }
    );


    document
        .getElementById(
            "sendButton"
        )
        .addEventListener(
            "click",
            sendMessage
        );

    document.getElementById("messages").addEventListener("scroll", event => {
        if (event.currentTarget.scrollTop < 40) loadOlderMessages();
    });


    document
        .getElementById(
            "messageInput"
        )
        .addEventListener(
            "keydown",
            event => {

                if (
                    event.key === "Enter"
                ) {

                    sendMessage();

                }

            }
        );

}


/* =================================
   메시지 전송
================================= */

async function sendMessage() {

    if (document.getElementById("sendButton").disabled) return;

    const input =
        document.getElementById(
            "messageInput"
        );


    const text =
        input.value.trim();


    if (!text && !OurcomFiles.hasFile()) {
        return;
    }

    if (!socket || !socket.connected) {
        alert("채팅 서버에 연결 중입니다. 잠시 후 다시 보내주세요.");
        return;
    }

    OurcomFiles.setSending(true);
    let attachment;
    try {
        attachment = await OurcomFiles.uploadSelected();
    } catch (error) {
        alert(error.message || "파일을 전송하지 못했습니다.");
        OurcomFiles.setSending(false);
        return;
    }
    OurcomFiles.setSending(false);

    const clientId = `${Date.now()}-${Math.random().toString(36).slice(2)}`;
    const reply = replyingTo;

    addMessage({
        id: `pending-${clientId}`,
        clientId,
        pending: true,
        roomId,
        userId: currentUser.id,
        userName: currentUser.name,
        text,
        attachment,
        time: "전송 중",
        replyToId: reply ? reply.id : null,
        replyToName: reply ? reply.name : null,
        replyToText: reply ? reply.text : null
    });


    const payload = { roomId, text, attachment, replyToId: reply ? reply.id : null, clientId };
    pendingMessages.set(clientId, payload);
    socket.emit("chat room message", payload);

    watchPendingMessage(clientId);


    input.value = "";
    input.dispatchEvent(new Event("blur"));

    cancelReply();

    input.focus();

}


/* =================================
   단체방 관리
================================= */

async function showMembers() {
    if (!currentRoom || roomMembers.length === 0) return;
    document.getElementById("roomManageModal").style.display = "flex";
    await renderRoomManager();
}

function closeRoomManager(event) {
    if (event && event.target !== event.currentTarget) return;
    document.getElementById("roomManageModal").style.display = "none";
}

async function roomRequest(url, method, body) {
    const response = await fetch(url, {
        method,
        headers: body ? { "Content-Type": "application/json" } : undefined,
        body: body ? JSON.stringify(body) : undefined
    });
    const data = await response.json();
    if (!response.ok || !data.success) {
        throw new Error(data.message || "요청을 처리하지 못했습니다.");
    }
    return data;
}

async function renderRoomManager() {
    const controls = document.getElementById("ownerRoomControls");
    const list = document.getElementById("roomMemberList");
    controls.innerHTML = "";
    list.innerHTML = "";

    const isOwner = currentRoom.creatorId === currentUser.id;

    if (isOwner) {
        const renameSection = document.createElement("div");
        renameSection.className = "manage-section";
        renameSection.innerHTML = `
            <div class="manage-label">방 이름 변경</div>
            <div class="manage-form">
                <input id="roomRenameInput" maxlength="50" aria-label="새 방 이름">
                <button type="button" onclick="renameRoom()">변경</button>
            </div>
        `;
        renameSection.querySelector("input").value = currentRoom.name;
        controls.appendChild(renameSection);

        const inviteSection = document.createElement("div");
        inviteSection.className = "manage-section";
        inviteSection.innerHTML = `
            <div class="manage-label">멤버 초대</div>
            <div class="manage-form">
                <select id="roomInviteSelect" aria-label="초대할 사용자"></select>
                <button id="roomInviteButton" type="button" onclick="inviteRoomMember()">초대</button>
            </div>
        `;
        controls.appendChild(inviteSection);

        try {
            const response = await fetch("/api/users");
            const data = await response.json();
            const select = inviteSection.querySelector("select");
            const button = inviteSection.querySelector("button");
            const memberIds = new Set(roomMembers.map(member => member.id));
            const candidates = data.success ? data.users.filter(user => !memberIds.has(user.id)) : [];
            if (candidates.length === 0) {
                const option = document.createElement("option");
                option.textContent = "초대할 사용자가 없습니다";
                option.value = "";
                select.appendChild(option);
                select.disabled = true;
                button.disabled = true;
            } else {
                candidates.forEach(user => {
                    const option = document.createElement("option");
                    option.value = user.id;
                    option.textContent = `${user.displayName || user.name} (@${user.id})`;
                    select.appendChild(option);
                });
            }
        } catch (error) {
            inviteSection.querySelector("select").innerHTML = "<option>사용자 목록을 불러오지 못했습니다</option>";
            inviteSection.querySelector("button").disabled = true;
        }
    } else {
        const note = document.createElement("p");
        note.className = "manage-note";
        note.textContent = `방장: ${currentRoom.creatorName} (@${currentRoom.creatorId})`;
        controls.appendChild(note);
    }

    roomMembers.forEach(member => {
        const row = document.createElement("div");
        row.className = "member-row";

        const identity = document.createElement("div");
        identity.className = "member-identity";
        const name = document.createElement("div");
        name.className = "member-name";
        name.textContent = member.displayName || member.name;
        if (member.id === currentRoom.creatorId) {
            const badge = document.createElement("span");
            badge.className = "owner-badge";
            badge.textContent = "방장";
            name.appendChild(badge);
        }
        const id = document.createElement("div");
        id.className = "member-id";
        id.textContent = `@${member.id}`;
        identity.append(name, id);
        row.appendChild(identity);

        if (isOwner && member.id !== currentUser.id) {
            const actions = document.createElement("div");
            actions.className = "member-actions";
            const transfer = document.createElement("button");
            transfer.className = "member-action";
            transfer.type = "button";
            transfer.textContent = "방장 넘기기";
            transfer.onclick = () => transferRoomOwner(member.id, member.displayName || member.name);
            const remove = document.createElement("button");
            remove.className = "member-action danger";
            remove.type = "button";
            remove.textContent = "내보내기";
            remove.onclick = () => removeRoomMember(member.id, member.displayName || member.name);
            actions.append(transfer, remove);
            row.appendChild(actions);
        }
        list.appendChild(row);
    });
}

async function refreshRoomManager() {
    if (!await loadRoom()) return;
    await renderRoomManager();
}

async function renameRoom() {
    const name = document.getElementById("roomRenameInput").value.trim();
    if (!name || name === currentRoom.name) return;
    try {
        await roomRequest(`/api/chat-rooms/${roomId}`, "PATCH", { name });
        await refreshRoomManager();
    } catch (error) { alert(error.message); }
}

async function inviteRoomMember() {
    const userId = document.getElementById("roomInviteSelect").value;
    if (!userId) return;
    try {
        await roomRequest(`/api/chat-rooms/${roomId}/members`, "POST", { userId });
        await refreshRoomManager();
    } catch (error) { alert(error.message); }
}

async function removeRoomMember(userId, name) {
    if (!confirm(`${name}님을 이 단체방에서 내보낼까요?`)) return;
    try {
        await roomRequest(`/api/chat-rooms/${roomId}/members/${encodeURIComponent(userId)}`, "DELETE");
        await refreshRoomManager();
    } catch (error) { alert(error.message); }
}

async function transferRoomOwner(userId, name) {
    if (!confirm(`${name}님에게 방장 권한을 넘길까요?`)) return;
    try {
        await roomRequest(`/api/chat-rooms/${roomId}/owner`, "PATCH", { userId });
        await refreshRoomManager();
    } catch (error) { alert(error.message); }
}


/* =================================
   채팅방 나가기
================================= */

async function leaveRoom() {

    const yes =
        confirm(
            "정말 이 채팅방에서 나갈까요?"
        );


    if (!yes) {
        return;
    }


    try {

        const response =
            await fetch(
                `/api/chat-rooms/${roomId}/leave`,
                {
                    method: "DELETE"
                }
            );


        const data =
            await response.json();


        if (!data.success) {

            alert(
                data.message ||
                "채팅방에서 나갈 수 없습니다."
            );

            return;

        }


        if (socket) {
            socket.disconnect();
        }


        location.href =
            "/group-create.html";

    }

    catch (error) {

        console.error(error);

        alert(
            "오류가 발생했습니다."
        );

    }

}


startChat();

</script>
